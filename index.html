<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Màn Hình Ngang Multi-touch</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Ngăn bôi đen văn bản khi chạm đè */
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none; /* Chống cuộn/panning mặc định trình duyệt */
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }

        /* Khung chứa game */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #222;
        }

        /* Canvas hiển thị game */
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Nút bật toàn màn hình & khóa ngang */
        #fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 5px;
            font-weight: bold;
            z-index: 100;
        }

        /* Giao diện nút điều khiển ảo overlay */
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            pointer-events: none; /* Rê/lướt qua vùng trống vẫn ghi nhận touch */
        }

        .btn-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .btn:active, .btn.active {
            background: rgba(255, 255, 255, 0.7);
            color: #000;
        }

        /* Cảnh báo nếu thiết bị ở màn hình dọc */
        @media screen and (orientation: portrait) {
            #portrait-warning {
                display: flex !important;
            }
        }

        #portrait-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Màn hình cảnh báo khi xoay dọc -->
    <div id="portrait-warning">
        <h2>Vui lòng xoay ngang màn hình để chơi</h2>
        <p>Hoặc nhấn nút bên dưới để vào chế độ Toàn màn hình ngang</p>
    </div>

    <div id="game-container">
        <button id="fullscreen-btn">Xoay Ngang & Toàn Màn Hình</button>
        <canvas id="gameCanvas"></canvas>

        <!-- Nút di chuyển và lướt (Dash) -->
        <div class="controls">
            <div class="btn-group">
                <div class="btn" id="btn-left">◄</div>
                <div class="btn" id="btn-right">►</div>
            </div>
            <div class="btn-group">
                <div class="btn" id="btn-dash">LƯỚT</div>
            </div>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // 1. KHÓA MÀN HÌNH NGANG (SCREEN ORIENTATION LOCK)
        // ----------------------------------------------------
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        async function lockLandscape() {
            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (err) {
                console.log("Không thể tự động khóa xoay ngang:", err);
            }
        }

        fullscreenBtn.addEventListener('click', lockLandscape);

        // ----------------------------------------------------
        // 2. XỬ LÝ ĐA ĐIỂM (MULTI-TOUCH) ĐỂ VỪA GIỮ NÚT VỪA LƯỚT
        // ----------------------------------------------------
        const keys = {
            left: false,
            right: false,
            dash: false
        };

        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnDash = document.getElementById('btn-dash');

        // Hàm kiểm tra điểm chạm (touch) đang đè lên nút nào
        function setupTouchControl(element, actionKey) {
            element.addEventListener('touchstart', (e) => {
                e.preventDefault();
                keys[actionKey] = true;
                element.classList.add('active');
            }, { passive: false });

            element.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys[actionKey] = false;
                element.classList.remove('active');
            }, { passive: false });

            element.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                keys[actionKey] = false;
                element.classList.remove('active');
            }, { passive: false });
        }

        setupTouchControl(btnLeft, 'left');
        setupTouchControl(btnRight, 'right');
        setupTouchControl(btnDash, 'dash');

        // ----------------------------------------------------
        // 3. CANVAS GAME DEMO
        // ----------------------------------------------------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Nhân vật
        const player = {
            x: 100,
            y: 200,
            width: 40,
            height: 40,
            speed: 5,
            isDashing: false,
            dashCooldown: false
        };

        function update() {
            let currentSpeed = player.speed;

            // Nếu đang đè nút Lướt (Dash) khi di chuyển
            if (keys.dash && !player.dashCooldown) {
                currentSpeed = player.speed * 2.5; // Tăng tốc độ khi lướt
            }

            if (keys.left) {
                player.x -= currentSpeed;
            }
            if (keys.right) {
                player.x += currentSpeed;
            }

            // Giới hạn trong màn hình
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ nhân vật
            ctx.fillStyle = keys.dash ? '#ff0055' : '#00adb5';
            ctx.fillRect(player.x, canvas.height / 2 - player.height / 2, player.width, player.height);

            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            update();
            draw();
        }

        gameLoop();
    </script>
</body>
</html>
