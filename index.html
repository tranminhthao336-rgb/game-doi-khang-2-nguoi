<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stickman Fighting - Skill Update</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #151515;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #222;
        }

        .controls-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 20px 40px;
            box-sizing: border-box;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .btn {
            position: relative;
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            backdrop-filter: blur(5px);
            overflow: hidden;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }

        .btn-attack {
            width: 75px;
            height: 75px;
            background: rgba(231, 76, 60, 0.5);
            border-color: #e74c3c;
            font-size: 28px;
        }

        .btn-jump {
            background: rgba(46, 204, 113, 0.5);
            border-color: #2ecc71;
        }

        /* Nút Kỹ Năng Bắn Chưởng */
        .btn-skill {
            background: rgba(155, 89, 182, 0.5);
            border-color: #9b59b6;
        }

        /* Lớp phủ Cooldown trên nút Skill */
        .cooldown-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #f1c40f;
            font-weight: bold;
            opacity: 0;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: auto;
        }

        #game-over-title {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #e74c3c;
        }

        #restart-btn {
            padding: 14px 40px;
            font-size: 22px;
            font-weight: bold;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #restart-btn:active {
            background: #2ecc71;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="game" width="800" height="400"></canvas>
    
    <div id="game-over-screen">
        <div id="game-over-title">VICTORY!</div>
        <button id="restart-btn" onclick="resetGame()">Chơi tiếp</button>
    </div>

    <div class="controls-layer">
        <!-- Cụm di chuyển -->
        <div class="btn-group">
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-right">▶</div>
        </div>
        <!-- Cụm kỹ năng & đòn đánh -->
        <div class="btn-group" style="align-items: flex-end;">
            <div class="btn btn-jump" id="btn-jump">▲</div>
            <div class="btn btn-skill" id="btn-skill">
                🔥
                <div class="cooldown-overlay" id="skill-cd"></div>
            </div>
            <div class="btn btn-attack" id="btn-attack">⚔️</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.6;
const GROUND = 340;
let isGameOver = false;

// Danh sách lưu trữ các chưởng năng lượng đang bay
const projectiles = [];

const p1 = { 
    x: 120, y: 150, vx: 0, vy: 0, w: 40, h: 80, hp: 100, 
    color: '#e74c3c', attacking: false, facingRight: 1, animFrame: 0,
    skillCooldown: false 
};

const p2 = { 
    x: 640, y: 150, vx: 0, vy: 0, w: 40, h: 80, hp: 100, 
    color: '#3498db', attacking: false, attackCooldown: false, facingRight: -1, animFrame: 0 
};

const inputs = { left: false, right: false };

function bindBtn(id, onPressDown, onPressUp) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); onPressDown(); });
    el.addEventListener('touchend', (e) => { e.preventDefault(); if (onPressUp) onPressUp(); });
    el.addEventListener('mousedown', () => onPressDown());
    el.addEventListener('mouseup', () => { if (onPressUp) onPressUp(); });
}

bindBtn('btn-left', () => inputs.left = true, () => inputs.left = false);
bindBtn('btn-right', () => inputs.right = true, () => inputs.right = false);

bindBtn('btn-jump', () => {
    if (p1.y + p1.h >= GROUND && !isGameOver) p1.vy = -14;
});

bindBtn('btn-attack', () => {
    if (!p1.attacking && !isGameOver) {
        p1.attacking = true;
        setTimeout(() => p1.attacking = false, 150);
    }
});

// XỬ LÝ KỸ NĂNG BẮN CHƯỞNG
function castSkill() {
    if (p1.skillCooldown || isGameOver) return;

    p1.skillCooldown = true;

    // Tạo chưởng năng lượng
    projectiles.push({
        x: p1.facingRight === 1 ? p1.x + p1.w : p1.x - 20,
        y: p1.y + 25,
        vx: p1.facingRight * 10, // Tốc độ bay
        radius: 12,
        color: '#f39c12',
        owner: 'p1'
    });

    // Xử lý Cooldown 3 giây trên UI
    const cdOverlay = document.getElementById('skill-cd');
    let timeLeft = 3;
    cdOverlay.style.opacity = '1';
    cdOverlay.innerText = timeLeft;

    const cdInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
            cdOverlay.innerText = timeLeft;
        } else {
            clearInterval(cdInterval);
            cdOverlay.style.opacity = '0';
            p1.skillCooldown = false;
        }
    }, 1000);
}

bindBtn('btn-skill', castSkill);

const keys = {};
window.onkeydown = e => {
    keys[e.code] = true;
    if (e.code === 'KeyW' && p1.y + p1.h >= GROUND && !isGameOver) p1.vy = -14;
    if (e.code === 'Space' && !p1.attacking && !isGameOver) {
        p1.attacking = true;
        setTimeout(() => p1.attacking = false, 150);
    }
    if (e.code === 'KeyE') castSkill(); // Nhấn E trên bàn phím để bắn chưởng
};
window.onkeyup = e => keys[e.code] = false;

function drawStickman(char) {
    const cx = char.x + char.w / 2;
    const cy = char.y;
    const dir = char.facingRight;

    ctx.strokeStyle = char.color;
    ctx.fillStyle = char.color;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.arc(cx, cy + 12, 12, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx, cy + 24);
    ctx.lineTo(cx, cy + 55);
    ctx.stroke();

    const walkOffset = (char.vx !== 0) ? Math.sin(char.animFrame * 0.3) * 15 : 0;
    
    ctx.beginPath();
    ctx.moveTo(cx, cy + 55);
    ctx.lineTo(cx - 12 + walkOffset, GROUND);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx, cy + 55);
    ctx.lineTo(cx + 12 - walkOffset, GROUND);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx, cy + 32);
    if (char.attacking) {
        ctx.lineTo(cx + dir * 45, cy + 32);
        ctx.stroke();
        
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(cx + dir * 50, cy + 32, 10, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.lineTo(cx + dir * 15, cy + 42);
        ctx.stroke();
    }

    ctx.beginPath();
    ctx.moveTo(cx, cy + 32);
    ctx.lineTo(cx - dir * 10, cy + 45);
    ctx.stroke();

    char.animFrame++;
}

function isHit(r1, r2) {
    return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
           r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
}

function updateAI() {
    const distance = p1.x - p2.x;
    p2.facingRight = distance > 0 ? 1 : -1;

    if (Math.abs(distance) > 50) {
        p2.vx = p2.facingRight * 3.5;
    } else {
        p2.vx = 0;
        if (!p2.attacking && !p2.attackCooldown) {
            p2.attacking = true;
            p2.attackCooldown = true;
            setTimeout(() => p2.attacking = false, 150);
            setTimeout(() => p2.attackCooldown = false, 500);
        }
    }

    if (p1.y < p2.y - 20 && p2.y + p2.h >= GROUND && Math.random() < 0.05) {
        p2.vy = -14;
    }
}

function keepInBounds(char) {
    if (char.x < 10) char.x = 10;
    if (char.x + char.w > canvas.width - 10) char.x = canvas.width - char.w - 10;
}

function loop() {
    if (isGameOver) return;

    p1.vx = 0;
    if (inputs.left || keys['KeyA']) { p1.vx = -5; p1.facingRight = -1; }
    if (inputs.right || keys['KeyD']) { p1.vx = 5; p1.facingRight = 1; }

    updateAI();

    p1.x += p1.vx; p1.y += p1.vy; p1.vy += GRAVITY;
    if (p1.y + p1.h > GROUND) { p1.y = GROUND - p1.h; p1.vy = 0; }
    keepInBounds(p1);

    p2.x += p2.vx; p2.y += p2.vy; p2.vy += GRAVITY;
    if (p2.y + p2.h > GROUND) { p2.y = GROUND - p2.h; p2.vy = 0; }
    keepInBounds(p2);

    // XỬ LÝ CHUYỂN ĐỘNG VÀ VA CHẠM CỦA CHƯỞNG NĂNG LƯỢNG
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;

        // Tạo khung va chạm cho đạn
        const projBox = { x: p.x - p.radius, y: p.y - p.radius, w: p.radius * 2, h: p.radius * 2 };

        // Kiểm tra trúng P2 (Máy)
        if (p.owner === 'p1' && isHit(projBox, p2)) {
            p2.hp = Math.max(0, p2.hp - 20); // Chưởng gây 20 HP sát thương
            p2.x += p.vx > 0 ? 35 : -35; // Đẩy lùi mạnh hơn
            projectiles.splice(i, 1);
            continue;
        }

        // Xóa chưởng khi bay ra khỏi màn hình
        if (p.x < 0 || p.x > canvas.width) {
            projectiles.splice(i, 1);
        }
    }

    // Hitbox cận chiến P1
    const hitBoxP1 = { 
        x: p1.facingRight === 1 ? p1.x + p1.w : p1.x - 40, 
        y: p1.y + 10, w: 40, h: 30 
    };
    if (p1.attacking && isHit(hitBoxP1, p2)) {
        p1.attacking = false;
        p2.hp = Math.max(0, p2.hp - 10);
        p2.x += p1.facingRight * 25;
    }

    // Hitbox cận chiến P2
    const hitBoxP2 = { 
        x: p2.facingRight === 1 ? p2.x + p2.w : p2.x - 40, 
        y: p2.y + 10, w: 40, h: 30 
    };
    if (p2.attacking && isHit(hitBoxP2, p1)) {
        p2.attacking = false;
        p1.hp = Math.max(0, p1.hp - 10);
        p1.x += p2.facingRight * 25;
    }

    // VẼ KHUNG HÌNH
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Mặt đất
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    ctx.lineTo(canvas.width, GROUND);
    ctx.stroke();

    // Vẽ Người que
    drawStickman(p1);
    drawStickman(p2);

    // VẼ CÁC QUẢ CẦU NĂNG LƯỢNG (PROJECTILES)
    projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        // Hiệu ứng phát sáng hạt chưởng
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius / 2, 0, Math.PI * 2);
        ctx.fill();
    });

    // UI Thanh máu
    ctx.fillStyle = '#333';
    ctx.fillRect(20, 20, 280, 16);
    ctx.fillRect(500, 20, 280, 16);

    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(20, 20, p1.hp * 2.8, 16);
    ctx.fillStyle = '#3498db';
    ctx.fillRect(500 + (100 - p2.hp) * 2.8, 20, p2.hp * 2.8, 16);

    ctx.fillStyle = 'white';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText(`P1 (BẠN)`, 20, 15);
    ctx.fillText(`P2 (MÁY)`, 740, 15);

    if (p1.hp <= 0 || p2.hp <= 0) {
        isGameOver = true;
        const screen = document.getElementById('game-over-screen');
        const title = document.getElementById('game-over-title');
        title.innerText = p1.hp <= 0 ? 'DEFEAT!' : 'VICTORY!';
        screen.style.display = 'flex';
        return;
    }

    requestAnimationFrame(loop);
}

function resetGame() {
    p1.hp = 100; p1.x = 120; p1.y = 150; p1.facingRight = 1; p1.skillCooldown = false;
    p2.hp = 100; p2.x = 640; p2.y = 150; p2.facingRight = -1;
    projectiles.length = 0;
    isGameOver = false;
    document.getElementById('skill-cd').style.opacity = '0';
    document.getElementById('game-over-screen').style.display = 'none';
    loop();
}

loop();
</script>

</body>
</html>
