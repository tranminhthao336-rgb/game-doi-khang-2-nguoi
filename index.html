<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stickman Fighting - Baldum Ulti</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; display: flex; justify-content: center; align-items: center; }
        #game-wrapper { position: relative; width: 100vw; height: 100vh; background: #151515; display: flex; justify-content: center; align-items: center; }
        canvas { width: 100%; height: 100%; object-fit: contain; background: #222; }
        
        .controls-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-end; padding: 15px 30px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; pointer-events: auto; }
        .btn { position: relative; width: 60px; height: 60px; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 50%; color: white; font-size: 22px; font-weight: bold; display: flex; align-items: center; justify-content: center; touch-action: manipulation; backdrop-filter: blur(5px); overflow: hidden; }
        .btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.95); }
        .btn-attack { width: 70px; height: 70px; background: rgba(231, 76, 60, 0.5); border-color: #e74c3c; font-size: 26px; }
        .btn-jump { background: rgba(46, 204, 113, 0.5); border-color: #2ecc71; }
        .btn-skill1 { background: rgba(155, 89, 182, 0.5); border-color: #9b59b6; }
        .btn-baldum { background: rgba(211, 84, 0, 0.6); border-color: #e67e22; font-size: 24px; }
        .cooldown-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #f1c40f; font-weight: bold; opacity: 0; }

        #settings-toggle { position: absolute; top: 15px; right: 15px; z-index: 20; padding: 8px 12px; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #777; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
        #debug-panel { display: none; position: absolute; top: 55px; right: 15px; z-index: 20; background: rgba(0,0,0,0.85); border: 1px solid #444; border-radius: 10px; padding: 15px; color: #fff; width: 260px; font-size: 13px; }
        #debug-panel h3 { margin-bottom: 10px; font-size: 15px; text-align: center; color: #f1c40f; }
        .debug-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .debug-row input { width: 70px; padding: 4px; border-radius: 4px; border: 1px solid #555; background: #222; color: #fff; text-align: center; }
        .debug-btn { width: 100%; padding: 8px; background: #e67e22; border: none; border-radius: 6px; color: white; font-weight: bold; margin-top: 5px; cursor: pointer; }

        /* Màn hình Bắt đầu & Game Over */
        .overlay-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; pointer-events: auto; }
        .overlay-title { font-size: 38px; font-weight: bold; color: #fff; margin-bottom: 25px; text-shadow: 0 0 10px #e74c3c; text-align: center; }
        .action-btn { padding: 14px 40px; font-size: 22px; font-weight: bold; background: #27ae60; color: white; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4); transition: transform 0.1s; }
        .action-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="game" width="800" height="400"></canvas>
    
    <!-- Màn hình Bắt đầu -->
    <div id="start-screen" class="overlay-screen">
        <div class="overlay-title">STICKMAN FIGHTING</div>
        <button class="action-btn" onclick="startGame()">BẮT ĐẦU CHƠI</button>
    </div>

    <!-- Màn hình Kết thúc -->
    <div id="game-over-screen" class="overlay-screen" style="display: none;">
        <div id="game-over-title" class="overlay-title">VICTORY!</div>
        <button class="action-btn" onclick="resetGame()">Chơi tiếp</button>
    </div>

    <button id="settings-toggle" onclick="toggleDebugPanel()">⚙️ Cài đặt & Hủy Cooldown</button>

    <div id="debug-panel">
        <h3>BẢNG ĐIỀU CHỈNH GAME</h3>
        <div class="debug-row">
            <label>Máu P1 (Bạn):</label>
            <input type="number" id="inp-hp-p1" value="100">
        </div>
        <div class="debug-row">
            <label>Sát thương P1:</label>
            <input type="number" id="inp-dmg-p1" value="10">
        </div>
        <hr style="border-color: #444; margin: 8px 0;">
        <div class="debug-row">
            <label>Máu P2 (Máy):</label>
            <input type="number" id="inp-hp-p2" value="100">
        </div>
        <div class="debug-row">
            <label>Sát thương P2:</label>
            <input type="number" id="inp-dmg-p2" value="10">
        </div>
        <button class="debug-btn" onclick="resetAllCooldowns()">⚡ HỦY HỒI CHIÊU NGAY</button>
        <button class="debug-btn" style="background: #2980b9;" onclick="applyStats()">✅ CẬP NHẬT THÔNG SỐ</button>
    </div>

    <div class="controls-layer">
        <div class="btn-group">
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group" style="align-items: flex-end;">
            <div class="btn btn-jump" id="btn-jump">▲</div>
            <div class="btn btn-baldum" id="btn-baldum">
                🌋
                <div class="cooldown-overlay" id="baldum-cd"></div>
            </div>
            <div class="btn btn-skill1" id="btn-skill1">
                🔥
                <div class="cooldown-overlay" id="skill1-cd"></div>
            </div>
            <div class="btn btn-attack" id="btn-attack">⚔️</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.6;
const GROUND = 340;
let isGameOver = false;
let isGameStarted = false; // Trạng thái bắt đầu game

const projectiles = [];
const baldumZones = [];

const stats = { p1MaxHp: 100, p1Dmg: 10, p2MaxHp: 100, p2Dmg: 10 };

const p1 = { 
    x: 120, y: 150, vx: 0, vy: 0, w: 40, h: 80, hp: 100, 
    color: '#e74c3c', attacking: false, facingRight: 1, animFrame: 0,
    skill1Cd: false, baldumCd: false, isStunned: false, stunTimer: null
};

const p2 = { 
    x: 640, y: 150, vx: 0, vy: 0, w: 40, h: 80, hp: 100, 
    color: '#3498db', attacking: false, attackCooldown: false, facingRight: -1, animFrame: 0,
    skill1Cd: false, baldumCd: false, isStunned: false, stunTimer: null
};

const inputs = { left: false, right: false };

function bindBtn(id, onPressDown, onPressUp) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); onPressDown(); });
    el.addEventListener('touchend', (e) => { e.preventDefault(); if (onPressUp) onPressUp(); });
    el.addEventListener('mousedown', () => onPressDown());
    el.addEventListener('mouseup', () => { if (onPressUp) onPressUp(); });
}

bindBtn('btn-left', () => inputs.left = true, () => inputs.left = false);
bindBtn('btn-right', () => inputs.right = true, () => inputs.right = false);

bindBtn('btn-jump', () => {
    if (p1.y + p1.h >= GROUND && !isGameOver && !p1.isStunned && isGameStarted) p1.vy = -14;
});

bindBtn('btn-attack', () => {
    if (!p1.attacking && !isGameOver && !p1.isStunned && isGameStarted) {
        p1.attacking = true;
        setTimeout(() => p1.attacking = false, 150);
    }
});

function castSkill1(char, cdOverlayId) {
    if (char.skill1Cd || isGameOver || char.isStunned || !isGameStarted) return;
    char.skill1Cd = true;

    projectiles.push({
        x: char.facingRight === 1 ? char.x + char.w : char.x - 20,
        y: char.y + 25,
        vx: char.facingRight * 10,
        radius: 12,
        color: char === p1 ? '#f39c12' : '#00d2d3',
        owner: char
    });

    startCooldown(char, 'skill1Cd', cdOverlayId, 3);
}

function castBaldumUlti(char, cdOverlayId) {
    if (char.baldumCd || isGameOver || char.isStunned || !isGameStarted) return;
    char.baldumCd = true;

    const target = char === p1 ? p2 : p1;
    
    baldumZones.push({
        x: target.x + target.w / 2,
        y: GROUND,
        radius: 65,
        delay: 48,
        activeTimer: 150,
        owner: char,
        triggered: false
    });

    startCooldown(char, 'baldumCd', cdOverlayId, 6);
}

function startCooldown(char, cdProp, cdOverlayId, seconds) {
    if (cdOverlayId) {
        const cdOverlay = document.getElementById(cdOverlayId);
        let timeLeft = seconds;
        cdOverlay.style.opacity = '1';
        cdOverlay.innerText = timeLeft;

        char[cdProp + 'Timer'] = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                cdOverlay.innerText = timeLeft;
            } else {
                clearInterval(char[cdProp + 'Timer']);
                cdOverlay.style.opacity = '0';
                char[cdProp] = false;
            }
        }, 1000);
    } else {
        setTimeout(() => { char[cdProp] = false; }, seconds * 1000);
    }
}

bindBtn('btn-skill1', () => castSkill1(p1, 'skill1-cd'));
bindBtn('btn-baldum', () => castBaldumUlti(p1, 'baldum-cd'));

const keys = {};
window.onkeydown = e => {
    keys[e.code] = true;
    if (e.code === 'KeyW' && p1.y + p1.h >= GROUND && !isGameOver && !p1.isStunned && isGameStarted) p1.vy = -14;
    if (e.code === 'Space' && !p1.attacking && !isGameOver && !p1.isStunned && isGameStarted) {
        p1.attacking = true;
        setTimeout(() => p1.attacking = false, 150);
    }
    if (e.code === 'KeyE') castSkill1(p1, 'skill1-cd');
    if (e.code === 'KeyR') castBaldumUlti(p1, 'baldum-cd');
};
window.onkeyup = e => keys[e.code] = false;

function toggleDebugPanel() {
    const p = document.getElementById('debug-panel');
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
}

function applyStats() {
    stats.p1MaxHp = parseInt(document.getElementById('inp-hp-p1').value) || 100;
    stats.p1Dmg = parseInt(document.getElementById('inp-dmg-p1').value) || 10;
    stats.p2MaxHp = parseInt(document.getElementById('inp-hp-p2').value) || 100;
    stats.p2Dmg = parseInt(document.getElementById('inp-dmg-p2').value) || 10;

    p1.hp = Math.min(p1.hp, stats.p1MaxHp);
    p2.hp = Math.min(p2.hp, stats.p2MaxHp);
    alert('Đã cập nhật!');
}

function resetAllCooldowns() {
    p1.skill1Cd = false; p1.baldumCd = false;
    p2.skill1Cd = false; p2.baldumCd = false;
    clearInterval(p1.skill1CdTimer); clearInterval(p1.baldumCdTimer);
    document.getElementById('skill1-cd').style.opacity = '0';
    document.getElementById('baldum-cd').style.opacity = '0';
}

function drawStickman(char) {
    const cx = char.x + char.w / 2;
    const cy = char.y;
    const dir = char.facingRight;

    ctx.strokeStyle = char.isStunned ? '#7f8c8d' : char.color;
    ctx.fillStyle = char.isStunned ? '#7f8c8d' : char.color;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';

    if (char.isStunned) {
        ctx.fillStyle = 'rgba(120, 66, 18, 0.7)';
        ctx.beginPath();
        ctx.fillRect(char.x - 5, char.y - 10, char.w + 10, char.h + 15);
        ctx.fillStyle = char.color;
    }

    ctx.beginPath();
    ctx.arc(cx, cy + 12, 12, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx, cy + 24);
    ctx.lineTo(cx, cy + 55);
    ctx.stroke();

    const walkOffset = (char.vx !== 0) ? Math.sin(char.animFrame * 0.3) * 15 : 0;
    
    ctx.beginPath();
    ctx.moveTo(cx, cy + 55);
    ctx.lineTo(cx - 12 + walkOffset, GROUND);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx, cy + 55);
    ctx.lineTo(cx + 12 - walkOffset, GROUND);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx, cy + 32);
    if (char.attacking) {
        ctx.lineTo(cx + dir * 45, cy + 32);
        ctx.stroke();
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(cx + dir * 50, cy + 32, 10, 0, Math.PI * 2);
        ctx.fill();
    } else {
        ctx.lineTo(cx + dir * 15, cy + 42);
        ctx.stroke();
    }

    ctx.beginPath();
    ctx.moveTo(cx, cy + 32);
    ctx.lineTo(cx - dir * 10, cy + 45);
    ctx.stroke();

    if (!char.isStunned && isGameStarted) char.animFrame++;
}

function isHit(r1, r2) {
    return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
           r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
}

function updateSmartAI() {
    if (!isGameStarted) return;

    const dx = p1.x - p2.x;
    const distance = Math.abs(dx);
    p2.facingRight = dx > 0 ? 1 : -1;

    if (p2.isStunned) { p2.vx = 0; return; }

    if (distance > 100 && distance < 350 && !p2.baldumCd && Math.random() < 0.02) {
        castBaldumUlti(p2, null);
    } else if (distance > 150 && !p2.skill1Cd && Math.random() < 0.03) {
        castSkill1(p2, null);
    }

    if (distance > 45) {
        p2.vx = p2.facingRight * 3.8;
    } else {
        p2.vx = 0;
        if (!p2.attacking && !p2.attackCooldown) {
            p2.attacking = true;
            p2.attackCooldown = true;
            setTimeout(() => p2.attacking = false, 150);
            setTimeout(() => p2.attackCooldown = false, 400);
        }
    }
}

function keepInBounds(char) {
    if (char.x < 10) char.x = 10;
    if (char.x + char.w > canvas.width - 10) char.x = canvas.width - char.w - 10;
}

function loop() {
    if (!isGameStarted || isGameOver) return;

    p1.vx = 0;
    if (!p1.isStunned) {
        if (inputs.left || keys['KeyA']) { p1.vx = -5; p1.facingRight = -1; }
        if (inputs.right || keys['KeyD']) { p1.vx = 5; p1.facingRight = 1; }
    }

    updateSmartAI();

    p1.x += p1.vx; p1.y += p1.vy; p1.vy += GRAVITY;
    if (p1.y + p1.h > GROUND) { p1.y = GROUND - p1.h; p1.vy = 0; }
    keepInBounds(p1);

    p2.x += p2.vx; p2.y += p2.vy; p2.vy += GRAVITY;
    if (p2.y + p2.h > GROUND) { p2.y = GROUND - p2.h; p2.vy = 0; }
    keepInBounds(p2);

    for (let i = baldumZones.length - 1; i >= 0; i--) {
        const z = baldumZones[i];
        if (z.delay > 0) {
            z.delay--;
        } else if (!z.triggered) {
            z.triggered = true;
            [p1, p2].forEach(char => {
                const charCenterX = char.x + char.w / 2;
                if (Math.abs(charCenterX - z.x) < z.radius) {
                    char.isStunned = true;
                    char.vy = -12;
                    const attackerDmg = z.owner === p1 ? stats.p1Dmg : stats.p2Dmg;
                    char.hp = Math.max(0, char.hp - attackerDmg * 2.5);

                    setTimeout(() => { char.isStunned = false; }, 2500);
                }
            });
        } else {
            z.activeTimer--;
            if (z.activeTimer <= 0) baldumZones.splice(i, 1);
        }
    }

    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        const projBox = { x: p.x - p.radius, y: p.y - p.radius, w: p.radius * 2, h: p.radius * 2 };
        const target = p.owner === p1 ? p2 : p1;
        const attackerDmg = p.owner === p1 ? stats.p1Dmg : stats.p2Dmg;

        if (isHit(projBox, target)) {
            target.hp = Math.max(0, target.hp - attackerDmg * 2);
            target.x += p.vx > 0 ? 30 : -30;
            projectiles.splice(i, 1);
            continue;
        }

        if (p.x < 0 || p.x > canvas.width) projectiles.splice(i, 1);
    }

    const hitBoxP1 = { x: p1.facingRight === 1 ? p1.x + p1.w : p1.x - 40, y: p1.y + 10, w: 40, h: 30 };
    if (p1.attacking && isHit(hitBoxP1, p2)) {
        p1.attacking = false;
        p2.hp = Math.max(0, p2.hp - stats.p1Dmg);
        p2.x += p1.facingRight * 25;
    }

    const hitBoxP2 = { x: p2.facingRight === 1 ? p2.x + p2.w : p2.x - 40, y: p2.y + 10, w: 40, h: 30 };
    if (p2.attacking && isHit(hitBoxP2, p1)) {
        p2.attacking = false;
        p1.hp = Math.max(0, p1.hp - stats.p2Dmg);
        p1.x += p2.facingRight * 25;
    }

    renderScreen();

    if (p1.hp <= 0 || p2.hp <= 0) {
        isGameOver = true;
        const screen = document.getElementById('game-over-screen');
        const title = document.getElementById('game-over-title');
        title.innerText = p1.hp <= 0 ? 'DEFEAT!' : 'VICTORY!';
        screen.style.display = 'flex';
        return;
    }

    requestAnimationFrame(loop);
}

function renderScreen() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#555'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(canvas.width, GROUND); ctx.stroke();

    baldumZones.forEach(z => {
        ctx.save();
        if (!z.triggered) {
            ctx.fillStyle = 'rgba(231, 76, 60, 0.3)';
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        } else {
            ctx.fillStyle = 'rgba(141, 110, 99, 0.5)';
            ctx.strokeStyle = '#d35400';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        }
        ctx.restore();
    });

    drawStickman(p1);
    drawStickman(p2);

    projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
    });

    ctx.fillStyle = '#333';
    ctx.fillRect(20, 20, 280, 16);
    ctx.fillRect(500, 20, 280, 16);

    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(20, 20, (p1.hp / stats.p1MaxHp) * 280, 16);
    ctx.fillStyle = '#3498db';
    ctx.fillRect(500 + (1 - p2.hp / stats.p2MaxHp) * 280, (p2.hp / stats.p2MaxHp) * 280, 16);

    ctx.fillStyle = 'white'; ctx.font = 'bold 12px sans-serif';
    ctx.fillText(`P1 (${p1.hp}/${stats.p1MaxHp})`, 20, 15);
    ctx.fillText(`P2 (${p2.hp}/${stats.p2MaxHp})`, 680, 15);
}

function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    isGameStarted = true;
    loop();
}

function resetGame() {
    p1.hp = stats.p1MaxHp; p1.x = 120; p1.y = 150; p1.facingRight = 1; p1.isStunned = false;
    p2.hp = stats.p2MaxHp; p2.x = 640; p2.y = 150; p2.facingRight = -1; p2.isStunned = false;
    projectiles.length = 0;
    baldumZones.length = 0;
    isGameOver = false;
    resetAllCooldowns();
    document.getElementById('game-over-screen').style.display = 'none';
    loop();
}

// Vẽ khung cảnh ban đầu khi chưa bấm bắt đầu
renderScreen();
</script>

</body>
</html>
