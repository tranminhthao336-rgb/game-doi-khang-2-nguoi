<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stickman Fighting - Audio & Characters</title>
    <style>
        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none; 
            margin: 0; 
            padding: 0; 
            touch-action: none; 
        }
        html, body { 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        #game-wrapper { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background: #111; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        canvas { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            background: #222; 
        }
        
        /* SẢNH CHỜ */
        #lobby-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
        }
        .lobby-title {
            font-size: 36px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(231, 76, 60, 0.8);
        }
        .section-title {
            color: #ddd;
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .char-select {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .char-card {
            width: 100px;
            height: 120px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .char-card.active {
            border-color: #f1c40f;
            background: rgba(241, 196, 15, 0.2);
            transform: scale(1.05);
        }
        .char-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            margin-bottom: 8px;
        }
        .char-name { color: #fff; font-size: 13px; font-weight: bold; }
        
        .play-btn {
            padding: 14px 40px;
            font-size: 20px;
            font-weight: bold;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .play-btn:active { transform: scale(0.95); background: #2ecc71; }

        /* ĐIỀU KHIỂN GAME */
        .controls-layer { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; 
            display: none; 
            justify-content: space-between; 
            align-items: flex-end; 
            padding: 15px 25px; 
            box-sizing: border-box; 
        }
        .btn-group { display: flex; gap: 12px; pointer-events: auto; }
        .btn { 
            position: relative; width: 65px; height: 65px; 
            background: rgba(255, 255, 255, 0.2); 
            border: 2px solid rgba(255, 255, 255, 0.6); 
            border-radius: 50%; color: white; font-size: 26px; font-weight: bold; 
            display: flex; align-items: center; justify-content: center; 
            backdrop-filter: blur(4px); 
        }
        .btn:active { background: rgba(255, 255, 255, 0.5); transform: scale(0.92); }
        .btn-attack { width: 75px; height: 75px; background: rgba(231, 76, 60, 0.6); border-color: #e74c3c; font-size: 30px; }
        .btn-jump { background: rgba(46, 204, 113, 0.6); border-color: #2ecc71; }
        .btn-skill { background: rgba(155, 89, 182, 0.6); border-color: #9b59b6; }
        
        .cooldown-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.75); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; 
            font-size: 18px; color: #f1c40f; font-weight: bold; opacity: 0; 
        }

        /* GAME OVER */
        #game-over-screen { 
            display: none; 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.85); 
            flex-direction: column; align-items: center; justify-content: center; 
            z-index: 10; pointer-events: auto; 
        }
        #game-over-title { font-size: 40px; font-weight: bold; color: #fff; margin-bottom: 20px; }
        .btn-action-group { display: flex; gap: 15px; }
        .game-btn { 
            padding: 12px 30px; font-size: 18px; font-weight: bold; 
            color: white; border: none; border-radius: 30px; 
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        .btn-restart { background: #27ae60; }
        .btn-lobby { background: #e67e22; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <!-- SẢNH CHỜ KHÓA CHỌN TƯỚNG -->
    <div id="lobby-screen">
        <div class="lobby-title">Stickman Arena</div>
        <div class="section-title">CHỌN NHÂN VẬT</div>
        
        <div class="char-select">
            <div class="char-card active" onclick="selectChar('red', this)">
                <div class="char-avatar" style="background: #e74c3c;"></div>
                <div class="char-name">HỎA ĐỎ</div>
            </div>
            <div class="char-card" onclick="selectChar('yellow', this)">
                <div class="char-avatar" style="background: #f1c40f;"></div>
                <div class="char-name">LÔI VÀNG</div>
            </div>
            <div class="char-card" onclick="selectChar('green', this)">
                <div class="char-avatar" style="background: #2ecc71;"></div>
                <div class="char-name">BĂNG XANH</div>
            </div>
        </div>

        <button class="play-btn" onclick="startGame()">BẮT ĐẦU ĐẤU</button>
    </div>

    <canvas id="game" width="800" height="400"></canvas>
    
    <!-- MÀN HÌNH KẾT THÚC -->
    <div id="game-over-screen">
        <div id="game-over-title">VICTORY!</div>
        <div class="btn-action-group">
            <button class="game-btn btn-restart" onclick="resetGame()">Chơi tiếp</button>
            <button class="game-btn btn-lobby" onclick="returnToLobby()">Về sảnh</button>
        </div>
    </div>

    <!-- PHÍM CẢM ỨNG -->
    <div class="controls-layer" id="controls">
        <div class="btn-group">
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group" style="align-items: flex-end;">
            <div class="btn btn-jump" id="btn-jump">▲</div>
            <div class="btn btn-skill" id="btn-skill">
                🔥
                <div class="cooldown-overlay" id="skill-cd"></div>
            </div>
            <div class="btn btn-attack" id="btn-attack">⚔️</div>
        </div>
    </div>
</div>

<script>
// HỆ THỐNG ÂM THANH (WEB AUDIO API - Không cần tệp mp3 ngoài)
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
}

function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'punch') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'skill') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.25);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
    } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.setValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
    }
}

// KHỞI TẠO GAME
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRAVITY = 0.6;
const GROUND = 340;
let isGameOver = false;
let inGame = false;
let selectedClass = 'red';

const CHAR_STATS = {
    red: { color: '#e74c3c', maxHp: 100, speed: 5 },
    yellow: { color: '#f1c40f', maxHp: 80, speed: 7 },
    green: { color: '#2ecc71', maxHp: 140, speed: 3.8 }
};

const projectiles = [];

const p1 = { 
    x: 120, y: 150, vx: 0, vy: 0, w: 40, h: 80, hp: 100, maxHp: 100, speed: 5,
    color: '#e74c3c', attacking: false, facingRight: 1, animFrame: 0,
    skillCooldown: false 
};

const p2 = { 
    x: 640, y: 150, vx: 0, vy: 0, w: 40, h: 80, hp: 100, maxHp: 100, speed: 3.8,
    color: '#3498db', attacking: false, attackCooldown: false, facingRight: -1, animFrame: 0,
    skillCooldown: false
};

const inputs = { left: false, right: false };

function selectChar(type, el) {
    selectedClass = type;
    document.querySelectorAll('.char-card').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
}

function bindBtn(id, onPressDown, onPressUp) {
    const el = document.getElementById(id);
    const start = (e) => { e.preventDefault(); initAudio(); onPressDown(); };
    const end = (e) => { e.preventDefault(); if (onPressUp) onPressUp(); };

    el.addEventListener('touchstart', start, { passive: false });
    el.addEventListener('touchend', end, { passive: false });
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
}

bindBtn('btn-left', () => inputs.left = true, () => inputs.left = false);
bindBtn('btn-right', () => inputs.right = true, () => inputs.right = false);

bindBtn('btn-jump', () => {
    if (p1.y + p1.h >= GROUND && !isGameOver && inGame) p1.vy = -14;
});

bindBtn('btn-attack', () => {
    if (!p1.attacking && !isGameOver && inGame) {
        p1.attacking = true;
        playSound('punch');
        setTimeout(() => p1.attacking = false, 150);
    }
});

function castSkill(char, targetOverlayId) {
    if (char.skillCooldown || isGameOver || !inGame) return;

    char.skillCooldown = true;
    playSound('skill');

    projectiles.push({
        x: char.facingRight === 1 ? char.x + char.w : char.x - 20,
        y: char.y + 25,
        vx: char.facingRight * 10,
        radius: 12,
        color: char.color,
        owner: char
    });

    if (targetOverlayId) {
        const cdOverlay = document.getElementById(targetOverlayId);
        let timeLeft = 3;
        cdOverlay.style.opacity = '1';
        cdOverlay.innerText = timeLeft;

        const cdInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                cdOverlay.innerText = timeLeft;
            } else {
                clearInterval(cdInterval);
                cdOverlay.style.opacity = '0';
                char.skillCooldown = false;
            }
        }, 1000);
    } else {
        setTimeout(() => { char.skillCooldown = false; }, 3000);
    }
}

bindBtn('btn-skill', () => castSkill(p1, 'skill-cd'));

function drawLimb(startX, startY, midX, midY, endX, endY, jointColor) {
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(midX, midY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(midX, midY);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    ctx.fillStyle = jointColor;
    ctx.beginPath();
    ctx.arc(midX, midY, 3, 0, Math.PI * 2);
    ctx.fill();
}

function drawStickman(char) {
    const cx = char.x + char.w / 2;
    const cy = char.y;
    const dir = char.facingRight;
    const isJumping = char.y + char.h < GROUND;

    ctx.strokeStyle = char.color;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.beginPath();
    ctx.arc(cx, cy + 12, 12, 0, Math.PI * 2);
    ctx.stroke();

    const hipX = cx;
    const hipY = cy + 55;
    ctx.beginPath();
    ctx.moveTo(cx, cy + 24);
    ctx.lineTo(hipX, hipY);
    ctx.stroke();

    const walk = (char.vx !== 0 && !isJumping) ? Math.sin(char.animFrame * 0.3) : 0;
    
    let knee1X = cx + (walk * 12) + (isJumping ? dir * 10 : 0);
    let knee1Y = cy + 68 + (isJumping ? -10 : 0);
    let foot1X = cx + (walk * 20) + (isJumping ? dir * 5 : 0);
    let foot1Y = GROUND;
    drawLimb(hipX, hipY, knee1X, knee1Y, foot1X, foot1Y, '#fff');

    let knee2X = cx - (walk * 12) - (isJumping ? dir * 5 : 0);
    let knee2Y = cy + 68 + (isJumping ? -5 : 0);
    let foot2X = cx - (walk * 20) - (isJumping ? dir * 15 : 0);
    let foot2Y = GROUND;
    drawLimb(hipX, hipY, knee2X, knee2Y, foot2X, foot2Y, '#fff');

    const shoulderX = cx;
    const shoulderY = cy + 32;

    let elbow2X = shoulderX - dir * 12;
    let elbow2Y = shoulderY + 12;
    let hand2X = shoulderX - dir * 18;
    let hand2Y = shoulderY + 25;
    drawLimb(shoulderX, shoulderY, elbow2X, elbow2Y, hand2X, hand2Y, '#fff');

    let elbow1X, elbow1Y, hand1X, hand1Y;
    if (char.attacking) {
        elbow1X = shoulderX + dir * 25;
        elbow1Y = shoulderY - 2;
        hand1X = shoulderX + dir * 48;
        hand1Y = shoulderY;

        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(hand1X, hand1Y, 8, 0, Math.PI * 2);
        ctx.fill();
    } else {
        elbow1X = shoulderX + dir * 12 + (walk * 8);
        elbow1Y = shoulderY + 12;
        hand1X = shoulderX + dir * 18 + (walk * 12);
        hand1Y = shoulderY + 24;
    }
    drawLimb(shoulderX, shoulderY, elbow1X, elbow1Y, hand1X, hand1Y, '#fff');

    char.animFrame++;
}

function isHit(r1, r2) {
    return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
           r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
}

function updateSmartAI() {
    const dx = p1.x - p2.x;
    const distance = Math.abs(dx);
    p2.facingRight = dx > 0 ? 1 : -1;

    let dangerProjectile = null;
    for (let p of projectiles) {
        if (p.owner === p1) {
            if ((p.vx > 0 && p.x < p2.x) || (p.vx < 0 && p.x > p2.x)) {
                if (Math.abs(p.x - p2.x) < 200) {
                    dangerProjectile = p;
                    break;
                }
            }
        }
    }

    if (dangerProjectile && p2.y + p2.h >= GROUND && Math.random() < 0.8) {
        p2.vy = -14;
    }

    if (distance > 180 && distance < 450 && !p2.skillCooldown && Math.random() < 0.03) {
        castSkill(p2, null);
    }

    if (distance > 45) {
        p2.vx = p2.facingRight * p2.speed;
    } else {
        p2.vx = 0;
        if (!p2.attacking && !p2.attackCooldown) {
            p2.attacking = true;
            p2.attackCooldown = true;
            playSound('punch');
            setTimeout(() => p2.attacking = false, 150);
            setTimeout(() => p2.attackCooldown = false, 400);
        }
    }

    if (p1.y < p2.y - 30 && p2.y + p2.h >= GROUND && Math.random() < 0.08) {
        p2.vy = -14;
    }
}

function keepInBounds(char) {
    if (char.x < 10) char.x = 10;
    if (char.x + char.w > canvas.width - 10) char.x = canvas.width - char.w - 10;
}

function loop() {
    if (!inGame || isGameOver) return;

    p1.vx = 0;
    if (inputs.left) { p1.vx = -p1.speed; p1.facingRight = -1; }
    if (inputs.right) { p1.vx = p1.speed; p1.facingRight = 1; }

    updateSmartAI();

    p1.x += p1.vx; p1.y += p1.vy; p1.vy += GRAVITY;
    if (p1.y + p1.h > GROUND) { p1.y = GROUND - p1.h; p1.vy = 0; }
    keepInBounds(p1);

    p2.x += p2.vx; p2.y += p2.vy; p2.vy += GRAVITY;
    if (p2.y + p2.h > GROUND) { p2.y = GROUND - p2.h; p2.vy = 0; }
    keepInBounds(p2);

    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        const projBox = { x: p.x - p.radius, y: p.y - p.radius, w: p.radius * 2, h: p.radius * 2 };

        if (p.owner === p1 && isHit(projBox, p2)) {
            p2.hp = Math.max(0, p2.hp - 20);
            p2.x += p.vx > 0 ? 35 : -35;
            playSound('hit');
            projectiles.splice(i, 1);
            continue;
        }

        if (p.owner === p2 && isHit(projBox, p1)) {
            p1.hp = Math.max(0, p1.hp - 20);
            p1.x += p.vx > 0 ? 35 : -35;
            playSound('hit');
            projectiles.splice(i, 1);
            continue;
        }

        if (p.x < 0 || p.x > canvas.width) projectiles.splice(i, 1);
    }

    const hitBoxP1 = { x: p1.facingRight === 1 ? p1.x + p1.w : p1.x - 40, y: p1.y + 10, w: 40, h: 30 };
    if (p1.attacking && isHit(hitBoxP1, p2)) {
        p1.attacking = false;
        p2.hp = Math.max(0, p2.hp - 10);
        p2.x += p1.facingRight * 25;
        playSound('hit');
    }

    const hitBoxP2 = { x: p2.facingRight === 1 ? p2.x + p2.w : p2.x - 40, y: p2.y + 10, w: 40, h: 30 };
    if (p2.attacking && isHit(hitBoxP2, p1)) {
        p2.attacking = false;
        p1.hp = Math.max(0, p1.hp - 10);
        p1.x += p2.facingRight * 25;
        playSound('hit');
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#555';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    ctx.lineTo(canvas.width, GROUND);
    ctx.stroke();

    drawStickman(p1);
    drawStickman(p2);

    projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius / 2, 0, Math.PI * 2);
        ctx.fill();
    });

    // Vẽ HP
    ctx.fillStyle = '#333';
    ctx.fillRect(20, 20, 280, 16);
    ctx.fillRect(500, 20, 280, 16);

    ctx.fillStyle = p1.color;
    ctx.fillRect(20, 20, (p1.hp / p1.maxHp) * 280, 16);
    ctx.fillStyle = p2.color;
    ctx.fillRect(500 + (1 - p2.hp / p2.maxHp) * 280, 20, (p2.hp / p2.maxHp) * 280, 16);

    ctx.fillStyle = 'white';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText(`P1 (BẠN)`, 20, 15);
    ctx.fillText(`P2 (AI)`, 740, 15);

    if (p1.hp <= 0 || p2.hp <= 0) {
        isGameOver = true;
        playSound('win');
        const screen = document.getElementById('game-over-screen');
        const title = document.getElementById('game-over-title');
        title.innerText = p1.hp <= 0 ? 'DEFEAT!' : 'VICTORY!';
        screen.style.display = 'flex';
        return;
    }

    requestAnimationFrame(loop);
}

function startGame() {
    initAudio();
    const stats = CHAR_STATS[selectedClass];
    p1.co
