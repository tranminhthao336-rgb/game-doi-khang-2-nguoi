<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stickman Fighting - Shop System</title>
    <style>
        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none; 
            margin: 0; 
            padding: 0; 
            touch-action: none; 
        }
        html, body { 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        #game-wrapper { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background: #111; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        canvas { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            background: #222; 
        }
        
        /* GIAO DIỆN SẢNH CHỜ (LOBBY UI) */
        #lobby-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .lobby-title {
            font-size: 42px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(231, 76, 60, 0.8), 0 0 30px rgba(52, 152, 219, 0.6);
        }
        .coin-display {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #f1c40f;
            border-radius: 20px;
            padding: 8px 20px;
            color: #f1c40f;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.3);
        }
        .lobby-cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .play-card {
            width: 180px;
            height: 130px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .play-card:active {
            transform: scale(0.95);
            background: rgba(46, 204, 113, 0.3);
            border-color: #2ecc71;
        }
        .play-card .icon { font-size: 38px; margin-bottom: 8px; }
        .play-card .text { color: #fff; font-weight: bold; font-size: 16px; }

        /* GIAO DIỆN CỬA HÀNG (SHOP UI) */
        #shop-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            flex-direction: column;
            align-items: center;
            padding: 20px;
            z-index: 30;
            overflow-y: auto;
        }
        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 700px;
            margin-bottom: 20px;
        }
        .shop-title { font-size: 28px; font-weight: bold; color: #fff; }
        .btn-close-shop {
            background: #e74c3c; color: white; border: none;
            padding: 8px 18px; font-weight: bold; border-radius: 20px; cursor: pointer;
        }
        .shop-section-title {
            color: #38bdf8; font-size: 18px; font-weight: bold; margin: 15px 0 10px 0; width: 100%; max-width: 700px; text-align: left;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 700px;
        }
        .shop-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .shop-item .item-icon { font-size: 30px; margin-bottom: 8px; }
        .shop-item .item-name { color: #fff; font-weight: bold; font-size: 15px; }
        .shop-item .item-desc { color: #94a3b8; font-size: 12px; margin: 4px 0 10px 0; text-align: center; }
        .shop-item-btn {
            background: #f1c40f; color: #000; border: none; padding: 6px 16px;
            font-weight: bold; border-radius: 15px; cursor: pointer; width: 100%;
        }
        .shop-item-btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        .shop-item-btn.equipped { background: #2ecc71; color: white; }

        /* HUD XU TRONG TRẬN ĐẤU */
        .ingame-coin-hud {
            position: absolute;
            top: 45px;
            left: 20px;
            color: #f1c40f;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            text-shadow: 1px 1px 2px #000;
        }

        /* NÚT ĐIỀU KHIỂN GAME */
        .controls-layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            pointer-events: none; 
            display: none; 
            justify-content: space-between; 
            align-items: flex-end; 
            padding: 15px 25px; 
            box-sizing: border-box; 
        }
        .btn-group { display: flex; gap: 12px; pointer-events: auto; }
        .btn { 
            position: relative; width: 65px; height: 65px; 
            background: rgba(255, 255, 255, 0.2); 
            border: 2px solid rgba(255, 255, 255, 0.6); 
            border-radius: 50%; color: white; font-size: 26px; font-weight: bold; 
            display: flex; align-items: center; justify-content: center; 
            backdrop-filter: blur(4px); 
        }
        .btn:active { background: rgba(255, 255, 255, 0.5); transform: scale(0.92); }
        .btn-attack { width: 75px; height: 75px; background: rgba(231, 76, 60, 0.6); border-color: #e74c3c; font-size: 30px; }
        .btn-jump { background: rgba(46, 204, 113, 0.6); border-color: #2ecc71; }
        .btn-dash { background: rgba(241, 196, 15, 0.6); border-color: #f1c40f; }
        .btn-skill { background: rgba(155, 89, 182, 0.6); border-color: #9b59b6; }
        
        .cooldown-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.75); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; 
            font-size: 18px; color: #f1c40f; font-weight: bold; opacity: 0; 
        }

        /* MÀN HÌNH GAME OVER */
        #game-over-screen { 
            display: none; 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.85); 
            flex-direction: column; align-items: center; justify-content: center; 
            z-index: 10; pointer-events: auto; 
        }
        #game-over-title { font-size: 40px; font-weight: bold; color: #fff; margin-bottom: 10px; text-shadow: 0 0 10px #e74c3c; }
        .reward-msg { font-size: 20px; color: #f1c40f; font-weight: bold; margin-bottom: 25px; }
        .btn-action-group { display: flex; gap: 15px; }
        .game-btn { 
            padding: 12px 30px; font-size: 18px; font-weight: bold; 
            color: white; border: none; border-radius: 30px; 
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        .btn-restart { background: #27ae60; }
        .btn-lobby { background: #e67e22; }
        .game-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div id="game-wrapper">
    <!-- SẢNH CHỜ (LOBBY) -->
    <div id="lobby-screen">
        <div class="lobby-title">Stickman Arena</div>
        <div class="coin-display">
            <span>🪙</span> <span id="lobby-coins">0</span> Xu
        </div>
        <div class="lobby-cards">
            <div class="play-card" onclick="startGame()">
                <div class="icon">⚔️</div>
                <div class="text">ĐẤU VỚI AI</div>
            </div>
            <div class="play-card" onclick="openShop()">
                <div class="icon">🛒</div>
                <div class="text">CỬA HÀNG</div>
            </div>
        </div>
    </div>

    <!-- CỬA HÀNG (SHOP) -->
    <div id="shop-screen">
        <div class="shop-header">
            <div class="shop-title">🛒 CỬA HÀNG</div>
            <div class="coin-display" style="margin-bottom:0;">
                <span>🪙</span> <span id="shop-coins">0</span> Xu
            </div>
            <button class="btn-close-shop" onclick="closeShop()">Đóng</button>
        </div>

        <div class="shop-section-title">⚡ Nâng cấp Chỉ số</div>
        <div class="shop-grid">
            <div class="shop-item">
                <div class="item-icon">❤️</div>
                <div class="item-name">Tăng Máu (+10 HP)</div>
                <div class="item-desc">Tăng lượng máu tối đa trong trận</div>
                <button class="shop-item-btn" id="btn-buy-hp" onclick="buyHpUpgrade()">Mua (2 Xu)</button>
            </div>
            <div class="shop-item">
                <div class="item-icon">🗡️</div>
                <div class="item-name">Tăng Cầu Đấm (+1 Dmg)</div>
                <div class="item-desc">Tăng sát thương của đòn đấm thường</div>
                <button class="shop-item-btn" id="btn-buy-dmg" onclick="buyDmgUpgrade()">Mua (3 Xu)</button>
            </div>
        </div>

        <div class="shop-section-title">🎨 Trang phục Nhân vật</div>
        <div class="shop-grid" id="skin-grid">
            <!-- Rendered by JS -->
        </div>
    </div>

    <canvas id="game" width="800" height="400"></canvas>
    
    <!-- MÀN HÌNH KẾT THÚC -->
    <div id="game-over-screen">
        <div id="game-over-title">VICTORY!</div>
        <div class="reward-msg" id="reward-text">+1 🪙</div>
        <div class="btn-action-group">
            <button class="game-btn btn-restart" onclick="resetGame()">Chơi tiếp</button>
            <button class="game-btn btn-lobby" onclick="returnToLobby()">Về sảnh</button>
        </div>
    </div>

    <!-- PHÍM ĐIỀU KHIỂN CẢM ỨNG & HUD -->
    <div class="controls-layer" id="controls">
        <div class="ingame-coin-hud">
            <span>🪙</span> <span id="ingame-coins">0</span>
        </div>
        <div class="btn-group">
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group" style="align-items: flex-end;">
            <div class="btn btn-jump" id="btn-jump">▲</div>
            <div class="btn btn-dash" id="btn-dash">
                ⚡
                <div class="cooldown-overlay" id="dash-cd"></div>
            </div>
            <div class="btn btn-skill" id="btn-skill">
                🔥
                <div class="cooldown-overlay" id="skill-cd"></div>
            </div>
            <div class="btn btn-attack" id="btn-attack">⚔️</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.6;
const GROUND = 340;
let isGameOver = false;
let inGame = false;

// DỮ LIỆU GAME (XU & SHOP)
let userCoins = parseInt(localStorage.getItem('stickman_coins')) || 0;
let p1BonusHp = parseInt(localStorage.getItem('stickman_bonus_hp')) || 0;
let p1BonusDmg = parseInt(localStorage.getItem('stickman_bonus_dmg')) || 0;

const skins = [
    { id: 'red', name: 'Đỏ Cổ Điển', color: '#e74c3c', price: 0 },
    { id: 'green', name: 'Lục Bảo', color: '#2ecc71', price: 2 },
    { id: 'yellow', name: 'Hoàng Kim', color: '#f1c40f', price: 4 },
    { id: 'purple', name: 'Tím Huyền Bí', color: '#9b59b6', price: 5 },
    { id: 'orange', name: 'Cam Năng Lượng', color: '#e67e22', price: 3 }
];

let unlockedSkins = JSON.parse(localStorage.getItem('stickman_unlocked_skins')) || ['red'];
let equippedSkinColor = localStorage.getItem('stickman_equipped_skin') || '#e74c3c';

function updateCoinDisplays() {
    document.getElementById('lobby-coins').innerText = userCoins;
    document.getElementById('ingame-coins').innerText = userCoins;
    document.getElementById('shop-coins').innerText = userCoins;
    localStorage.setItem('stickman_coins', userCoins);
}

function updateShopUI() {
    updateCoinDisplays();
    
    // Cập nhật nút mua HP/DMG
    document.getElementById('btn-buy-hp').innerText = `Mua (+10 HP) - 2 Xu (Đã có: +${p1BonusHp})`;
    document.getElementById('btn-buy-dmg').innerText = `Mua (+1 Dmg) - 3 Xu (Đã có: +${p1BonusDmg})`;

    // Render danh sách Skins
    const skinGrid = document.getElementById('skin-grid');
    skinGrid.innerHTML = '';
    
    skins.forEach(skin => {
        const isUnlocked = unlockedSkins.includes(skin.id);
        const isEquipped = equippedSkinColor === skin.color;
        
        let btnText = 'Mua';
        let btnClass = 'shop-item-btn';
        let btnDisabled = false;

        if (isEquipped) {
            btnText = 'Đang dùng';
            btnClass += ' equipped';
            btnDisabled = true;
        } else if (isUnlocked) {
            btnText = 'Trang bị';
        } else {
            btnText = `Mua (${skin.price} Xu)`;
        }

        const html = `
            <div class="shop-item">
                <div class="item-icon" style="color:${skin.color}">🧍</div>
                <div class="item-name" style="color:${skin.color}">${skin.name}</div>
                <div class="item-desc">Trang phục màu sắc độc đáo</div>
                <button class="${btnClass}" ${btnDisabled ? 'disabled' : ''} onclick="handleSkinClick('${skin.id}')">${btnText}</button>
            </div>
        `;
        skinGrid.innerHTML += html;
    });
}

function buyHpUpgrade() {
    if (userCoins >= 2) {
        userCoins -= 2;
        p1BonusHp += 10;
        localStorage.setItem('stickman_bonus_hp', p1BonusHp);
        updateShopUI();
    } else {
        alert("Bạn không đủ Xu!");
    }
}

function buyDmgUpgrade() {
    if (userCoins >= 3) {
        userCoins -= 3;
        p1BonusDmg += 1;
        localStorage.setItem('stickman_bonus_dmg', p1BonusDmg);
        updateShopUI();
    } else {
        alert("Bạn không đủ Xu!");
    }
}

function handleSkinClick(skinId) {
    const skin = skins.find(s => s.id === skinId);
    if (!skin) return;

    if (unlockedSkins.includes(skinId)) {
        equippedSkinColor = skin.color;
        p1.color = skin.color;
        localStorage.setItem('stickman_equipped_skin', equippedSkinColor);
        updateShopUI();
    } else {
        if (userCoins >= skin.price) {
            userCoins -= skin.price;
            unlockedSkins.push(skinId);
            equippedSkinColor = skin.color;
            p1.color = skin.color;
            localStorage.setItem('stickman_unlocked_skins', JSON.stringify(unlockedSkins));
            localStorage.setItem('stickman_equipped_skin', equippedSkinColor);
            updateShopUI();
        } else {
            alert("Bạn không đủ Xu!");
        }
    }
}

function openShop() {
    updateShopUI();
    document.getElementById('shop-screen').style.display = 'flex';
}

function closeShop() {
    document.getElementById('shop-screen').style.display = 'none';
}

const projectiles = [];

const p1 = { 
    x: 120, y: 150, vx: 0, vy: 0, w: 40, h: 80, hp: 100, maxHp: 100,
    color: equippedSkinColor, attacking: false, facingRight: 1, animFrame: 0,
    skillCooldown: false, isDashing: false, dashCooldown: false, dashHit: false
};

const p2 = { 
    x: 640, y: 150, vx: 0, vy: 0, w: 40, h: 80, hp: 100, maxHp: 100,
    color: '#3498db', attacking: false, attackCooldown: false, facingRight: -1, animFrame: 0,
    skillCooldown: false, isDashing: false, dashCooldown: false, dashHit: false,
    rapidPunchCooldown: false, isRapidPunching: false
};

const inputs = { left: false, right: false };

function bindBtn(id, onPressDown, onPressUp) {
    const el = document.getElementById(id);
    const start = (e) => { e.preventDefault(); onPressDown(); };
    const end = (e) => { e.preventDefault(); if (onPressUp) onPressUp(); };

    el.addEventListener('touchstart', start, { passive: false });
    el.addEventListener('touchend', end, { passive: false });
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
}

bindBtn('btn-left', () => inputs.left = true, () => inputs.left = false);
bindBtn('btn-right', () => inputs.right = true, () => inputs.right = false);

bindBtn('btn-jump', () => {
    if (p1.y + p1.h >= GROUND && !isGameOver && inGame) p1.vy = -14;
});

bindBtn('btn-attack', () => {
    if (!p1.attacking && !isGameOver && inGame) {
        p1.attacking = true;
        setTimeout(() => p1.attacking = false, 150);
    }
});

function castDash(char, targetOverlayId) {
    if (char.dashCooldown || char.isDashing || isGameOver || !inGame) return;

    char.isDashing = true;
    char.dashCooldown = true;
    char.dashHit = false;

    setTimeout(() => {
        char.isDashing = false;
    }, 200);

    if (targetOverlayId) {
        const cdOverlay = document.getElementById(targetOverlayId);
        let timeLeft = 2;
        cdOverlay.style.opacity = '1';
        cdOverlay.innerText = timeLeft;

        const cdInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                cdOverlay.innerText = timeLeft;
            } else {
                clearInterval(cdInterval);
                cdOverlay.style.opacity = '0';
                char.dashCooldown = false;
            }
        }, 1000);
    } else {
        setTimeout(() => { char.dashCooldown = false; }, 2000);
    }
}

bindBtn('btn-dash', () => castDash(p1, 'dash-cd'));

function castSkill(char, targetOverlayId) {
    if (char.skillCooldown || isGameOver || !inGame) return;

    char.skillCooldown = true;

    projectiles.push({
        x: char.facingRight === 1 ? char.x + char.w : char.x - 20,
        y: char.y + 25,
        vx: char.facingRight * 10,
        radius: 12,
        color: char === p1 ? '#f39c12' : '#00d2d3',
        owner: char
    });

    if (targetOverlayId) {
        const cdOverlay = document.getElementById(targetOverlayId);
        let timeLeft = 3;
        cdOverlay.style.opacity = '1';
        cdOverlay.innerText = timeLeft;

        const cdInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                cdOverlay.innerText = timeLeft;
            } else {
                clearInterval(cdInterval);
                cdOverlay.style.opacity = '0';
                char.skillCooldown = false;
            }
        }, 1000);
    } else {
        setTimeout(() => { char.skillCooldown = false; }, 3000);
    }
}

bindBtn('btn-skill', () => castSkill(p1, 'skill-cd'));

function castAiRapidPunch() {
    if (p2.rapidPunchCooldown || p2.isRapidPunching || isGameOver || !inGame) return;

    p2.isRapidPunching = tru
