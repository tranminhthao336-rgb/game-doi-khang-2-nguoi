<!DOCTYPE html>
<html>
<head>
    <title>Core Fighting Game</title>
    <style>
        canvas { background: #222; border: 2px solid #fff; display: block; margin: 20px auto; }
    </style>
</head>
<body>

<canvas id="game" width="600" height="300"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// 1. CẤU HÌNH HỆ THỐNG
const GRAVITY = 0.5;
const GROUND = 260;

// 2. TẠO KHUNG NHÂN VẬT (OBJECT)
const p1 = { x: 50, y: 100, vx: 0, vy: 0, w: 30, h: 60, hp: 100, color: 'red', attacking: false };
const p2 = { x: 500, y: 100, vx: 0, vy: 0, w: 30, h: 60, hp: 100, color: 'blue', attacking: false };

const keys = {};
window.onkeydown = e => {
    keys[e.code] = true;
    if (e.code === 'Space' && !p1.attacking) {
        p1.attacking = true;
        setTimeout(() => p1.attacking = false, 150); // Đòn đánh kéo dài 150ms
    }
};
window.onkeyup = e => keys[e.code] = false;

// 3. THUẬT TOÁN XỬ LÝ VA CHẠM (HITBOX)
function isHit(rect1, rect2) {
    return rect1.x < rect2.x + rect2.w &&
           rect1.x + rect1.w > rect2.x &&
           rect1.y < rect2.y + rect2.h &&
           rect1.y + rect1.h > rect2.y;
}

// 4. VÒNG LẶP CHÍNH (GAME LOOP)
function loop() {
    // A. Điều khiển P1
    p1.vx = 0;
    if (keys['KeyA']) p1.vx = -4;
    if (keys['KeyD']) p1.vx = 4;
    if (keys['KeyW'] && p1.y + p1.h >= GROUND) p1.vy = -12; // Nhảy

    // B. Cập nhật vật lý P1
    p1.x += p1.vx;
    p1.y += p1.vy;
    p1.vy += GRAVITY; // Áp dụng trọng lực
    if (p1.y + p1.h > GROUND) { p1.y = GROUND - p1.h; p1.vy = 0; } // Chạm đất

    // C. Tính toán Hitbox tấn công của P1
    const hitBox = { x: p1.x + p1.w, y: p1.y + 10, w: 40, h: 20 };

    // D. Kiểm tra trúng đòn
    if (p1.attacking && isHit(hitBox, p2)) {
        p1.attacking = false; // Tránh gây sát thương nhiều lần trong 1 cú đấm
        p2.hp -= 10;
        p2.x += 20; // Đẩy lùi P2 khi trúng đòn
    }

    // E. VẼ LẠI MÀN HÌNH
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Vẽ mặt đất
    ctx.fillStyle = '#666';
    ctx.fillRect(0, GROUND, canvas.width, 40);

    // Vẽ P1 & P2
    ctx.fillStyle = p1.color; ctx.fillRect(p1.x, p1.y, p1.w, p1.h);
    ctx.fillStyle = p2.color; ctx.fillRect(p2.x, p2.y, p2.w, p2.h);

    // Vẽ đòn đánh P1 (màu vàng)
    if (p1.attacking) {
        ctx.fillStyle = 'yellow';
        ctx.fillRect(hitBox.x, hitBox.y, hitBox.w, hitBox.h);
    }

    // Vẽ thanh máu đơn giản
    ctx.fillStyle = 'white';
    ctx.fillText(`P1 HP: ${p1.hp}`, 20, 30);
    ctx.fillText(`P2 HP: ${p2.hp}`, 500, 30);

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
