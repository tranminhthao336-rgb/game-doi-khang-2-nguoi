<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Võ Sĩ Huyền Thoại - Fixed Touch</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #111; color: #fff;
            font-family: sans-serif;
            text-align: center;
        }

        #game-container {
            position: relative;
            width: 100vw; height: 100vh;
        }

        .screen {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #111;
            padding: 15px;
            overflow-y: auto;
            z-index: 20;
        }
        .active { display: block !important; }

        h1, h2 { color: #f1c40f; margin: 10px 0; }
        
        .menu-btn { 
            background: #27ae60; color: white; border: none; padding: 14px 25px; 
            font-size: 18px; font-weight: bold; border-radius: 8px; margin: 12px auto; 
            width: 70%; max-width: 320px; cursor: pointer; display: block;
            touch-action: manipulation;
        }
        .btn-shop { background: #e67e22; }
        .btn-back { background: #7f8c8d; width: auto; padding: 8px 18px; font-size: 14px; display: inline-block; }

        .coin-txt { font-size: 18px; color: #f1c40f; font-weight: bold; margin: 8px 0; }

        .shop-item { background: #222; border: 2px solid #444; border-radius: 8px; padding: 10px; margin: 8px auto; width: 85%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; }
        .shop-item.equipped { border-color: #2ecc71; }
        .buy-btn { background: #e74c3c; color: white; border: none; padding: 10px 14px; border-radius: 5px; font-weight: bold; }

        .level-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 15px auto; max-width: 550px; }
        .lvl-btn { background: #34495e; color: white; border: 2px solid #5d6d7e; border-radius: 8px; padding: 12px 0; font-size: 15px; font-weight: bold; }
        .lvl-btn.boss { background: #c0392b; border-color: #f1c40f; }

        #fullscreen-btn {
            position: absolute; top: 8px; right: 8px;
            padding: 8px 12px; background: rgba(255,255,255,0.9);
            color: #000; border: none; border-radius: 5px; font-weight: bold; font-size: 12px; z-index: 100;
        }

        #gameScreen { padding: 0; background: #000; overflow: hidden; }
        .ui-bar { position: absolute; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 6px 15px; background: rgba(0,0,0,0.6); z-index: 10; font-size: 13px; }
        .health-box { width: 100px; background: #444; height: 14px; border: 1px solid #fff; border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
        .health-fill { height: 100%; width: 100%; background: #2ecc71; transition: width 0.1s; }
        #p2Health { background: #e74c3c; }

        canvas { display: block; width: 100vw; height: 100vh; }

        .controls {
            position: absolute; bottom: 15px; left: 0; width: 100%;
            display: flex; justify-content: space-between; padding: 0 20px;
            pointer-events: none; z-index: 10;
        }
        .btn-group { display: flex; gap: 8px; pointer-events: auto; }
        .btn {
            width: 55px; height: 55px; background: rgba(255,255,255,0.25);
            border: 2px solid rgba(255,255,255,0.5); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: bold; font-size: 13px;
        }
        .btn:active, .btn.active { background: rgba(255,255,255,0.7); color: #000; }
        .btn-action { background: rgba(230, 126, 34, 0.4); }
        .btn-dash { background: rgba(41, 128, 185, 0.4); }

        #skillNotice { position: absolute; top: 35px; width: 100%; color: #e74c3c; font-weight: bold; font-size: 16px; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>

    <div id="game-container">
        <button id="fullscreen-btn">Xoay Ngang / Fullscreen</button>

        <!-- SẢNH GAME -->
        <div id="lobbyScreen" class="screen active">
            <h1>VÕ SĨ HUYỀN THOẠI</h1>
            <div class="coin-txt">💰 Xu: <span id="lobbyCoins">0</span></div>
            <button class="menu-btn" id="btn-goto-level">🎮 CHƠI GAME</button>
            <button class="menu-btn btn-shop" id="btn-goto-shop">🛒 CỬA HÀNG</button>
        </div>

        <!-- CỬA HÀNG -->
        <div id="shopScreen" class="screen">
            <h2>CỬA HÀNG VŨ KHÍ</h2>
            <div class="coin-txt">💰 Xu: <span id="shopCoins">0</span></div>
            
            <div class="shop-item" id="item-dagger">
                <div style="text-align:left;">
                    <b style="color:#bdc3c7;">🗡️ Dao Găm</b><br><small>Giá: 5 Xu | ST: +1</small>
                </div>
                <button class="buy-btn" id="btn-buy-dagger">Mua (5 Xu)</button>
            </div>

            <div class="shop-item" id="item-sword">
                <div style="text-align:left;">
                    <b style="color:#f1c40f;">⚔️ Kiếm</b><br><small>Giá: 20 Xu | ST: +5</small>
                </div>
                <button class="buy-btn" id="btn-buy-sword">Mua (20 Xu)</button>
            </div>

            <div class="shop-item" id="item-axe">
                <div style="text-align:left;">
                    <b style="color:#e74c3c;">🪓 Rìu</b><br><small>Giá: 30 Xu | ST: +10</small>
                </div>
                <button class="buy-btn" id="btn-buy-axe">Mua (30 Xu)</button>
            </div>

            <button class="menu-btn btn-back" id="btn-back-lobby1">⬅️ Quay Lại</button>
        </div>

        <!-- CHỌN MÀN CHƠI -->
        <div id="levelScreen" class="screen">
            <h2>CHỌN MÀN CHƠI</h2>
            <button class="menu-btn btn-back" id="btn-back-lobby2">⬅️ Sảnh Game</button>
            <div class="level-grid" id="levelGrid"></div>
        </div>

        <!-- MÀN CHƠI GAME -->
        <div id="gameScreen" class="screen">
            <div class="ui-bar">
                <div>P1 (LVL <span id="p1DmgBonus">+0</span>) <div class="health-box"><div id="p1Health" class="health-fill"></div></div></div>
                <button class="btn-back" id="btn-quit-game">Thoát</button>
                <div>Màn <span id="currentLvlTxt">1</span> (AI) <div class="health-box"><div id="p2Health" class="health-fill"></div></div></div>
            </div>
            <div id="skillNotice"></div>
            
            <canvas id="gameCanvas"></canvas>

            <div class="controls">
                <div class="btn-group">
                    <div class="btn" id="btn-left">◄</div>
                    <div class="btn" id="btn-right">►</div>
                </div>
                <div class="btn-group">
                    <div class="btn btn-action" id="btn-punch">Đấm</div>
                    <div class="btn btn-action" id="btn-kick">Đá</div>
                    <div class="btn btn-action" id="btn-jump">▲</div>
                    <div class="btn btn-dash" id="btn-dash">💨</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- HÀM BẮT SỰ KIỆN NÚT BẤM CẢ CẢM ỨNG LẪN CHUỘT ---
        function addClickEvent(elementId, callback) {
            const el = typeof elementId === 'string' ? document.getElementById(elementId) : elementId;
            if (!el) return;
            
            let handled = false;
            el.addEventListener('touchstart', (e) => {
                e.preventDefault();
                initAudio();
                handled = true;
                callback(e);
            }, { passive: false });

            el.addEventListener('click', (e) => {
                if (handled) { handled = false; return; }
                initAudio();
                callback(e);
            });
        }

        // --- ÂM THANH ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'punch') {
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'kick') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'dash') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.08);
                }
            } catch(e) {}
        }

        // --- DỮ LIỆU GAME ---
        let coins = parseInt(localStorage.getItem('coins')) || 0;
        let inventory = JSON.parse(localStorage.getItem('inventory')) || [];
        let equippedWeapon = localStorage.getItem('equippedWeapon') || null;
        let currentLevel = 1;

        const weaponsData = {
            dagger: { name: "Dao Găm", price: 5, dmg: 1 },
            sword: { name: "Kiếm", price: 20, dmg: 5 },
            axe: { name: "Rìu", price: 30, dmg: 10 }
        };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            updateCoinsUI();
            if(id === 'shopScreen') updateShopUI();
            if(id === 'levelScreen') renderLevels();
        }

        function updateCoinsUI() {
            document.getElementById('lobbyCoins').innerText = coins;
            document.getElementById('shopCoins').innerText = coins;
            localStorage.setItem('coins', coins);
        }

        function updateShopUI() {
            for (let w in weaponsData) {
                let elem = document.getElementById('item-' + w);
                let btn = elem.querySelector('.buy-btn');
                if (inventory.includes(w)) {
                    if (equippedWeapon === w) {
                        elem.classList.add('equipped');
                        btn.innerText = "Đang Bị";
                        btn.style.background = "#2ecc71";
                    } else {
                        elem.classList.remove('equipped');
                        btn.innerText = "Trang Bị";
                        btn.style.background = "#2980b9";
                    }
                } else {
                    btn.innerText = `Mua (${weaponsData[w].price} Xu)`;
                }
            }
        }

        function handleBuyOrEquip(w) {
            if (inventory.includes(w)) {
                equippedWeapon = w;
                localStorage.setItem('equippedWeapon', equippedWeapon);
                updateShopUI();
            } else {
                let price = weaponsData[w].price;
                if (coins >= price) {
                    coins -= price;
                    inventory.push(w);
                    equippedWeapon = w;
                    localStorage.setItem('inventory', JSON.stringify(inventory));
                    localStorage.setItem('equippedWeapon', equippedWeapon);
                    updateCoinsUI();
                    updateShopUI();
                } else {
                    alert("Bạn không đủ Xu!");
                }
            }
        }

        function renderLevels() {
            let grid = document.getElementById('levelGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 30; i++) {
                let btn = document.createElement('button');
                btn.className = 'lvl-btn' + (i % 10 === 0 ? ' boss' : '');
                btn.innerText = i % 10 === 0 ? `M${i}👑` : `M${i}`;
                addClickEvent(btn, () => startLevel(i));
                grid.appendChild(btn);
            }
        }

        // --- SỰ KIỆN CHUYỂN MÀN HÌNH ---
        addClickEvent('btn-goto-level', () => showScreen('levelScreen'));
        addClickEvent('btn-goto-shop', () => showScreen('shopScreen'));
        addClickEvent('btn-back-lobby1', () => showScreen('lobbyScreen'));
        addClickEvent('btn-back-lobby2', () => showScreen('lobbyScreen'));
        addClickEvent('btn-quit-game', () => quitToLobby());

        addClickEvent('btn-buy-dagger', () => handleBuyOrEquip('dagger'));
        addClickEvent('btn-buy-sword', () => handleBuyOrEquip('sword'));
        addClickEvent('btn-buy-axe', () => handleBuyOrEquip('axe'));

        addClickEvent('fullscreen-btn', async () => {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (err) {}
        });

        // --- BỘ ĐIỀU KHIỂN MULTI-TOUCH CHO GAMEPLAY ---
        const keys = { left: false, right: false };
        function bindTouchControl(id, action) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => {
                e.preventDefault();
                initAudio();
                el.classList.add('active');
                if (action === 'left') keys.left = true;
                if (action === 'right') keys.right = true;
                if (action === 'jump') jumpP1();
                if (action === 'punch') attackP1('punch');
                if (action === 'kick') attackP1('kick');
                if (action === 'dash') dashP1();
            }, { passive: false });

            el.addEventListener('touchend', (e) => {
                e.preventDefault();
                el.classList.remove('active');
                if (action === 'left') keys.left = false;
                if (action === 'right') keys.right = false;
            }, { passive: false });
        }

        bindTouchControl('btn-left', 'left');
        bindTouchControl('btn-right', 'right');
        bindTouchControl('btn-jump', 'jump');
        bindTouchControl('btn-punch', 'punch');
        bindTouchControl('btn-kick', 'kick');
        bindTouchControl('btn-dash', 'dash');

        // --- GAME LOGIC & CANVAS ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let p1, p2, gameInterval, bossProjectiles = [], p1Stunned = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        const getGroundY = () => canvas.height - 50;

        function startLevel(lvl) {
            currentLevel = lvl;
            showScreen('gameScreen');
            resizeCanvas();

            document.getElementById('currentLvlTxt').innerText = lvl;
            let p1Bonus = equippedWeapon ? weaponsData[equippedWeapon].dmg : 0;
            document.getElementById('p1DmgBonus').innerText = `+${p1Bonus}`;

            let p2MaxHp = 100 + (lvl - 1) * 20;
            let aiWeapon = null, aiBonusDmg = 0;
            if (lvl >= 30) { aiWeapon = 'axe'; aiBonusDmg = 10; }
            else if (lvl >= 20) { aiWeapon = 'sword'; aiBonusDmg = 5; }
            else if (lvl >= 10) { aiWeapon = 'dagger'; aiBonusDmg = 1; }

            p1 = { x: 80, y: getGroundY() - 70, w: 30, h: 70, vx: 0, vy: 0, hp: 100, maxHp: 100, color: '#3498db', attacking: false, attackType: null, facingRight: true, isDashing: false, weapon: equippedWeapon, bonusDmg: p1Bonus };
            p2 = { x: canvas.width - 120, y: getGroundY() - 70, w: 30, h: 70, vx: 0, vy: 0, hp: p2MaxHp, maxHp: p2MaxHp, color: '#e74c3c', attacking: false, attackType: null, facingRight: false, isDashing: false, weapon: aiWeapon, bonusDmg: aiBonusDmg, skillTimer: 0 };

            bossProjectiles = []; p1Stunned = false; updateUI();

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(update, 1000 / 60);
        }

        function jumpP1() { if (p1 && p1.y >= getGroundY() - 70 && !p1Stunned) p1.vy = -13; }

        function dashP1() {
            if (!p1 || p1.isDashing || p1Stunned) return;
            p1.isDashing = true; playSound('dash');
            p1.vx = (p1.facingRight ? 1 : -1) * 18;
            setTimeout(() => { if(p1) p1.isDashing = false; }, 120);
        }

        function attackP1(type) {
            if (!p1 || p1.attacking || p1Stunned) return;
            p1.attacking = true; p1.attackType = type; playSound(type);
            let range = type === 'punch' ? 55 : 70;
            let damage = (type === 'punch' ? 8 : 12) + p1.bonusDmg;

            if (p2 && Math.abs((p1.x + p1.w/2) - (p2.x + p2.w/2)) < range && Math.abs(p1.y - p2.y) < 40) {
                p2.hp = Math.max(0, p2.hp - damage);
                p2.x += p1.facingRight ? 15 : -15;
                updateUI();
            }
            setTimeout(() => { if(p1) { p1.attacking = false; p1.attackType = null; } }, 200);
        }

        function updateAI() {
            if (!p1 || !p2 || p2.hp <= 0 || p1.hp <= 0) return;
            p2.facingRight = p2.x < p1.x;
            let dist = Math.abs((p2.x + p2.w/2) - (p1.x + p1.w/2));
            let aiSpeed = 2 + Math.min(currentLevel * 0.1, 2.5);
            let dodgeChance = 0.3 + Math.min(currentLevel * 0.02, 0.5);

            p2.skillTimer += 1/60;

            if (currentLevel === 10 && p2.skillTimer >= 8) {
                showNotice("TRÙM MÀN 10: ĐẤM LIÊN HOÀN!");
                p2.skillTimer = 0;
                let duration = 0;
                let flurry = setInterval(() => {
                    if (!p2 || p2.hp <= 0) { clearInterval(flurry); return; }
                    p2.attacking = true; p2.attackType = 'punch'; playSound('punch');
                    if (dist < 60) { p1.hp = Math.max(0, p1.hp - 5); updateUI(); }
                    duration += 0.2;
                    if (duration >= 1.6) { clearInterval(flurry); p2.attacking = false; }
                }, 180);
            }

            if (currentLevel === 20 && p2.skillTimer >= 7) {
                showNotice("TRÙM MÀN 20: KIẾM KHÍ!");
                p2.skillTimer = 0; playSound('dash');
                bo
