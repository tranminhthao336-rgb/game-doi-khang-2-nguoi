<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game Doi Khang - Full Sound & Smooth Controls</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
        .game-container { position: relative; width: 100%; max-width: 600px; margin: 0 auto; }
        
        .ui-bar { display: flex; justify-content: space-between; padding: 10px; background: #222; }
        .health-box { width: 45%; background: #444; height: 20px; border: 2px solid #fff; border-radius: 5px; overflow: hidden; }
        .health-fill { height: 100%; width: 100%; background: #2ecc71; transition: width 0.1s; }
        #p2Health { background: #e74c3c; float: right; }

        canvas { background: #1a1a2e; border-bottom: 4px solid #4e4e50; display: block; width: 100%; height: auto; }

        .controls { display: flex; justify-content: space-between; padding: 15px 10px; max-width: 600px; margin: 0 auto; }
        .btn-group { display: grid; grid-template-columns: repeat(3, 50px); grid-gap: 8px; }
        .btn { background: #333; color: #fff; border: 2px solid #555; border-radius: 10px; font-weight: bold; font-size: 15px; height: 50px; width: 50px; display: flex; align-items: center; justify-content: center; }
        .btn:active { background: #666; }
        .btn-punch { background: #e67e22; }
        .btn-kick { background: #e74c3c; }
        .btn-dash { background: #2980b9; grid-column: span 2; width: 100%; }
        #restartBtn { display: none; margin: 10px auto; padding: 10px 20px; background: #27ae60; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="ui-bar">
            <div>Player 1<div class="health-box"><div id="p1Health" class="health-fill"></div></div></div>
            <div>AI Smart<div class="health-box"><div id="p2Health" class="health-fill"></div></div></div>
        </div>
        <canvas id="gameCanvas" width="600" height="300"></canvas>
        <button id="restartBtn" onclick="initGame()">🎮 Chơi Lại</button>
    </div>

    <!-- Phím Bấm Giữ Cảm Ứng & Chuột -->
    <div class="controls">
        <div class="btn-group">
            <button class="btn" 
                    ontouchstart="keys.left=true" ontouchend="keys.left=false" 
                    onmousedown="keys.left=true" onmouseup="keys.left=false" onmouseleave="keys.left=false">◄</button>
            <button class="btn" onclick="jumpP1()">▲</button>
            <button class="btn" 
                    ontouchstart="keys.right=true" ontouchend="keys.right=false" 
                    onmousedown="keys.right=true" onmouseup="keys.right=false" onmouseleave="keys.right=false">►</button>
        </div>
        <div class="btn-group" style="grid-template-columns: repeat(2, 55px);">
            <button class="btn btn-punch" onclick="attackP1('punch')">Đấm</button>
            <button class="btn btn-kick" onclick="attackP1('kick')">Đá</button>
            <button class="btn btn-dash" onclick="dashP1()">💨 Lướt</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Hệ thống phát hiệu ứng âm thanh tổng hợp
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'punch') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'kick') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(240, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'dash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.start(); osc.stop(audioCtx.currentTime + 0.12);
            }
        }

        let p1, p2, gameInterval;
        const keys = { left: false, right: false };

        function initGame() {
            document.getElementById("restartBtn").style.display = "none";
            p1 = { x: 100, y: 190, w: 30, h: 70, vx: 0, vy: 0, hp: 100, color: '#3498db', attacking: false, attackType: null, facingRight: true, isDashing: false };
            p2 = { x: 470, y: 190, w: 30, h: 70, vx: 0, vy: 0, hp: 100, color: '#e74c3c', attacking: false, attackType: null, facingRight: false, isDashing: false };
            updateUI();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(update, 1000 / 60);
        }

        function jumpP1() { if (p1.y >= 190) p1.vy = -12; }

        function dashP1() {
            if (p1.isDashing) return;
            p1.isDashing = true;
            playSound('dash');
            let dashDir = p1.facingRight ? 1 : -1;
            p1.vx = dashDir * 18;
            setTimeout(() => { p1.isDashing = false; }, 120);
        }

        function attackP1(type) {
            if (p1.attacking) return;
            p1.attacking = true;
            p1.attackType = type;
            playSound(type);
            
            let range = type === 'punch' ? 50 : 65;
            let damage = type === 'punch' ? 8 : 12;

            if (Math.abs((p1.x + p1.w/2) - (p2.x + p2.w/2)) < range && Math.abs(p1.y - p2.y) < 40) {
                p2.hp = Math.max(0, p2.hp - damage);
                p2.x += p1.facingRight ? 20 : -20;
                playSound('hit');
                updateUI();
            }

            setTimeout(() => { p1.attacking = false; p1.attackType = null; }, 200);
        }

        // Trí thông minh nhân tạo (AI)
        function updateAI() {
            if (p2.hp <= 0 || p1.hp <= 0) return;
            p2.facingRight = p2.x < p1.x;

            let dist = Math.abs((p2.x + p2.w/2) - (p1.x + p1.w/2));

            // Né đòn bằng lướt/nhảy khi Player 1 ra đòn áp sát
            if (p1.attacking && dist < 70 && Math.random() < 0.65 && !p2.isDashing) {
                p2.isDashing = true;
                playSound('dash');
                p2.vx = p2.facingRight ? -16 : 16; 
                if (Math.random() < 0.5 && p2.y >= 190) p2.vy = -10; 
                setTimeout(() => { p2.isDashing = false; }, 120);
                return;
            }

            if (!p2.isDashing) {
                if (dist > 50) {
                    p2.vx = p2.facingRight ? 3 : -3; 
                } else {
                    p2.vx = 0;
                    if (!p2.attacking && Math.random() < 0.08) {
                        attackAI(Math.random() < 0.5 ? 'punch' : 'kick');
                    }
                }
            }
        }

        function attackAI(type) {
            if (p2.attacking) return;
            p2.attacking = true;
            p2.attackType = type;
            playSound(type);

            let range = type === 'punch' ? 50 : 65;
            let damage = type === 'punch' ? 7 : 11;

            if (Math.abs((p2.x + p2.w/2) - (p1.x + p1.w/2)) < range && Math.abs(p2.y - p1.y) < 40) {
                p1.hp = Math.max(0, p1.hp - damage);
                p1.x += p2.facingRight ? 18 : -18;
                playSound('hit');
                updateUI();
            }

            setTimeout(() => { p2.attacking = false; p2.attackType = null; }, 200);
        }

        function updateUI() {
            document.getElementById("p1Health").style.width = p1.hp + "%";
            document.getElementById("p2Health").style.width = p2.hp + "%";
        }

        // Vẽ nhân vật có đầy đủ Đầu, Thân, Tay, Chân
        function drawFighter(char) {
            ctx.save();
            let cx = char.x + char.w / 2;
            let cy = char.y;

            ctx.strokeStyle = char.isDashing ? '#00ffff' : char.color;
            ctx.fillStyle = char.color;
            ctx.lineWidth = 4;

            // Đầu
            ctx.beginPath();
            ctx.arc(cx, cy + 10, 10, 0, Math.PI * 2);
            ctx.fill();

            // Thân
            ctx.beginPath();
            ctx.moveTo(cx, cy + 20);
            ctx.lineTo(cx, cy + 45);
            ctx.stroke();

            // Chân
            ctx.beginPath();
            if (char.attacking && char.attackType === 'kick') {
                let kDir = char.facingRight ? 25 : -25;
                ctx.moveTo(cx, cy + 45); ctx.lineTo(cx + kDir, cy + 40);
                ctx.moveTo(cx, cy + 45); ctx.lineTo(cx - kDir/2, cy + 65);
            } else {
                ctx.moveTo(cx, cy + 45); ctx.lineTo(cx - 10, cy + 70);
                ctx.moveTo(cx, cy + 45); ctx.lineTo(cx + 10, cy + 70);
            }
            ctx.stroke();

            // Tay
            ctx.beginPath();
            if (char.attacking && char.attackType === 'punch') {
                let pDir = char.facingRight ? 30 : -30;
                ctx.moveTo(cx, cy + 28); ctx.lineTo(cx + pDir, cy + 28);
                ctx.moveTo(cx, cy + 28); ctx.lineTo(cx - 10, cy + 40);
            } else {
                let guardDir = char.facingRight ? 10 : -10;
                ctx.moveTo(cx, cy + 28); ctx.lineTo(cx + guardDir, cy + 35);
                ctx.moveTo(cx, cy + 28); ctx.lineTo(cx - guardDir, cy + 35);
            }
            ctx.stroke();

            ctx.restore();
        }

        function update() {
            // Xử lý giữ phím di chuyển mượt mà liên tục
            if (!p1.isDashing) {
                if (keys.left) { p1.vx = -4.5; p1.facingRight = false; }
                else if (keys.right) { p1.vx = 4.5; p1.facingRight = true; }
                else { p1.vx = 0; }
            }

            // Vật lý & Trọng lực
            p1.x += p1.vx; p1.y += p1.vy;
            if (p1.y < 190) p1.vy += 0.8; else { p1.y = 190; p1.vy = 0; }

            p2.x += p2.vx; p2.y += p2.vy;
            if (p2.y < 190) p2.vy += 0.8; else { p2.y = 190; p2.vy = 0; }
            
            p1.x = Math.max(10, Math.min(canvas.width - 40, p1.x));
            p2.x = Math.max(10, Math.min(canvas.width - 40, p2.x));

            updateAI();

            // Vẽ màn hình
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 260, canvas.width, 40);

            drawFighter(p1);
            drawFighter(p2);

            if (p1.hp <= 0 || p2.hp <= 0) {
                clearInterval(gameInterval);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 30px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(p1.hp > 0 ? "PLAYER 1 THẮNG!" : "AI THẮNG!", canvas.width / 2, 140);
                document.getElementById("restartBtn").style.display = "block";
            }
        }

        initGame();
    </script>
</body>
        </html>
