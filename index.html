<!DOCTYPE html><html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Võ Sĩ Huyền Thoại</title><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

button{
    font-family:Arial,sans-serif;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

#game-container{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

/* MÀN HÌNH */
.screen{
    display:none;
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#111;
    padding:15px;
    overflow-y:auto;
    z-index:10;
}

.screen.active{
    display:block;
}

h1,h2{
    color:#f1c40f;
    text-align:center;
    margin:15px 0;
}

/* MENU */
.menu-btn{
    display:block;
    width:80%;
    max-width:350px;
    margin:15px auto;
    padding:16px;
    border:none;
    border-radius:10px;
    background:#27ae60;
    color:white;
    font-size:18px;
    font-weight:bold;
}

.btn-shop{
    background:#e67e22;
}

.btn-back{
    background:#7f8c8d;
    color:white;
    border:none;
    border-radius:8px;
    padding:10px 18px;
    font-weight:bold;
}

.coin-txt{
    color:#f1c40f;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin:15px;
}

/* CỬA HÀNG */
.shop-item{
    width:90%;
    max-width:500px;
    margin:12px auto;
    padding:15px;
    background:#222;
    border:2px solid #444;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.shop-item.equipped{
    border-color:#2ecc71;
}

.buy-btn{
    border:none;
    border-radius:8px;
    padding:10px 12px;
    background:#e74c3c;
    color:#fff;
    font-weight:bold;
}

/* CHỌN MÀN */
.level-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
    max-width:600px;
    margin:20px auto;
}

.lvl-btn{
    border:2px solid #566573;
    border-radius:8px;
    padding:14px 5px;
    background:#34495e;
    color:white;
    font-weight:bold;
    font-size:14px;
}

.lvl-btn.boss{
    background:#c0392b;
    border-color:#f1c40f;
}

/* GAME */
#gameScreen{
    padding:0;
    overflow:hidden;
    background:#000;
}

#gameCanvas{
    display:block;
    width:100%;
    height:100%;
}

.ui-bar{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    min-height:45px;
    padding:7px 8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:5px;
    background:rgba(0,0,0,.75);
    z-index:30;
    font-size:12px;
}

.health-box{
    width:85px;
    height:13px;
    display:inline-block;
    vertical-align:middle;
    background:#444;
    border:1px solid white;
    border-radius:5px;
    overflow:hidden;
}

.health-fill{
    height:100%;
    width:100%;
    background:#2ecc71;
}

#p2Health{
    background:#e74c3c;
}

#skillNotice{
    position:absolute;
    top:55px;
    left:0;
    width:100%;
    z-index:35;
    text-align:center;
    color:#f1c40f;
    font-size:16px;
    font-weight:bold;
    pointer-events:none;
    text-shadow:1px 1px 2px black;
}

.controls{
    position:absolute;
    left:0;
    bottom:15px;
    width:100%;
    padding:0 12px;
    display:flex;
    justify-content:space-between;
    z-index:40;
    pointer-events:none;
}

.btn-group{
    display:flex;
    gap:7px;
    pointer-events:auto;
}

.btn{
    width:55px;
    height:55px;
    border:2px solid rgba(255,255,255,.7);
    border-radius:50%;
    background:rgba(255,255,255,.25);
    color:white;
    font-weight:bold;
    font-size:12px;
    touch-action:none;
}

.btn.active,
.btn:active{
    background:rgba(255,255,255,.8);
    color:#000;
}

.btn-action{
    background:rgba(230,126,34,.6);
}

.btn-dash{
    background:rgba(41,128,185,.7);
}

#fullscreen-btn{
    position:absolute;
    top:7px;
    right:7px;
    z-index:100;
    border:none;
    border-radius:6px;
    padding:7px 9px;
    background:#fff;
    color:#000;
    font-size:11px;
    font-weight:bold;
}

/* Điện thoại màn hình nhỏ */
@media(max-width:500px){
    .shop-item{
        font-size:14px;
    }

    .health-box{
        width:65px;
    }

    .btn{
        width:48px;
        height:48px;
        font-size:10px;
    }

    .controls{
        padding:0 8px;
        gap:5px;
    }

    .btn-group{
        gap:5px;
    }
}
</style></head><body><div id="game-container"><!-- NÚT FULLSCREEN --><button id="fullscreen-btn">⛶</button>

<!-- ================= SẢNH GAME ================= --><div id="lobbyScreen" class="screen active"><h1>⚔️ VÕ SĨ HUYỀN THOẠI ⚔️</h1>

    </button>
</div>

<div class="shop-item" id="item-axe">
    <div>
        <b>🪓 Rìu</b><br>

    </div>

    </button>

<button class="btn-back" id="btn-back-lobby1">

</button>

</div><!-- ================= CHỌN MÀN ================= --><div id="levelScreen" class="screen"><h2>🎮 CHỌN MÀN CHƠI</h2>

<button class="btn-back" id="btn-back-lobby2">
    ⬅️ Sảnh Game
</button>

<div class="level-grid" id="levelGrid"></div>

</div><!-- ================= GAME ================= --><div id="gameScreen" class="screen"><div class="ui-bar">

    <div>
        P1 +<span id="p1DmgBonus">0</span>
        <div class="health-box">
            <div id="p1Health" class="health-fill"></div>
        </div>
    </div>

    <button class="btn-back" id="btn-quit-game">

    </button>

        </div>

</div>

        <button class="btn btn-action" id="btn-punch">Đấm</button>
        <button class="btn btn-action" id="btn-kick">Đá</button>

    </div>

</div>

</div></div><script>

/* =====================================================
   DỮ LIỆU GAME
===================================================== */

let coins = parseInt(localStorage.getItem("legendCoins")) || 0;
let inventory = JSON.parse(
    localStorage.getItem("legendInventory")
) || [];

let equippedWeapon =
    localStorage.getItem("legendWeapon") || null;

const weaponsData = {
    dagger:{
        name:"Dao Găm",
        price:5,
        dmg:1
    },

    sword:{
        name:"Kiếm",
        price:20,
        dmg:5
    },

    axe:{
        name:"Rìu",
        price:30,
        dmg:10
    }
};


/* =====================================================
   ÂM THANH
===================================================== */

let audioCtx = null;

function initAudio(){

    try{

        if(!audioCtx){

            audioCtx = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }

        if(audioCtx.state === "suspended"){
            audioCtx.resume();
        }

    }catch(e){}
}

function playSound(type){

    if(!audioCtx) return;

    try{

        const osc =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if(type === "punch"){
            osc.frequency.setValueAtTime(
                150,
                audioCtx.currentTime
            );
        }

        if(type === "kick"){
            osc.frequency.setValueAtTime(
                220,
                audioCtx.currentTime
            );
        }

        if(type === "skill"){
            osc.frequency.setValueAtTime(
                400,
                audioCtx.currentTime
            );
        }

        gain.gain.setValueAtTime(
            0.3,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.01,
            audioCtx.currentTime + 0.12
        );

        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);

    }catch(e){}
}


/* =====================================================
   HIỂN THỊ MÀN HÌNH
===================================================== */

function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(screen=>{
            screen.classList.remove("active");
        });

    const target =
        document.getElementById(id);

    if(target){
        target.classList.add("active");
    }

    updateCoinsUI();

    if(id === "shopScreen"){
        updateShopUI();
    }

    if(id === "levelScreen"){
        renderLevels();
    }
}

function updateCoinsUI(){

    const lobby =
        document.getElementById("lobbyCoins");

    const shop =
        document.getElementById("shopCoins");

    if(lobby){
        lobby.textContent = coins;
    }

    if(shop){
        shop.textContent = coins;
    }

    localStorage.setItem(
        "legendCoins",
        coins
    );
}


/* =====================================================
   CỬA HÀNG
===================================================== */

function updateShopUI(){

    Object.keys(weaponsData).forEach(w=>{

        const item =
            document.getElementById("item-" + w);

        if(!item) return;

        const btn =
            item.querySelector(".buy-btn");

        if(inventory.includes(w)){

            if(equippedWeapon === w){

                item.classList.add("equipped");

                btn.textContent =
                    "Đang dùng";

                btn.style.background =
                    "#2ecc71";

            }else{

                item.classList.remove("equipped");

                btn.textContent =
                    "Trang bị";

                btn.style.background =
                    "#2980b9";
            }

        }else{

            item.classList.remove("equipped");

            btn.textContent =
                "Mua (" +
                weaponsData[w].price +
                " Xu)";

            btn.style.background =
                "#e74c3c";
        }
    });
}

function buyOrEquip(w){

    initAudio();

    if(inventory.includes(w)){

        equippedWeapon = w;

        localStorage.setItem(
            "legendWeapon",
            equippedWeapon
        );

        updateShopUI();

        return;
    }

    const price =
        weaponsData[w].price;

    if(coins < price){

        alert("Bạn không đủ Xu!");

        return;
    }

    coins -= price;

    inventory.push(w);

    equippedWeapon = w;

    localStorage.setItem(
        "legendInventory",
        JSON.stringify(inventory)
    );

    localStorage.setItem(
        "legendWeapon",
        equippedWeapon
    );

    updateCoinsUI();
    updateShopUI();
}


/* =====================================================
   CHỌN 30 MÀN
===================================================== */

function renderLevels(){

    const grid =
        document.getElementById("levelGrid");

    if(!grid) return;

    grid.innerHTML = "";

    for(let i=1;i<=30;i++){

        const btn =
            document.createElement("button");

        btn.type = "button";

        btn.className =
            "lvl-btn";

        if(i % 10 === 0){

            btn.classList.add("boss");

            btn.textContent =
                "👑 " + i;

        }else{

            btn.textContent =
                "Màn " + i;
        }

        btn.addEventListener(
            "click",
            function(){

                initAudio();

                startLevel(i);
            }
        );

        grid.appendChild(btn);
    }
}


/* =====================================================
   CANVAS VÀ BIẾN GAME
===================================================== */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

let p1 = null;
let p2 = null;

let currentLevel = 1;

let gameTimer = null;

let gameEnding = false;

let projectiles = [];

let p1Stunned = false;

let stunTimeout = null;

const keys = {
    left:false,
    right:false
};

function resizeCanvas(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

function getGroundY(){

    return canvas.height - 45;
}


/* =====================================================
   BẮT ĐẦU MÀN
===================================================== */

function startLevel(level){

    currentLevel = level;

    gameEnding = false;

    keys.left = false;
    keys.right = false;

    projectiles = [];

    p1Stunned = false;

    if(stunTimeout){
        clearTimeout(stunTimeout);
    }

    showScreen("gameScreen");

    resizeCanvas();

    document
        .getElementById("currentLvlTxt")
        .textContent = level;

    const playerBonus =
        equippedWeapon
        ? weaponsData[equippedWeapon].dmg
        : 0;

    document
        .getElementById("p1DmgBonus")
        .textContent = playerBonus;

    /*
        MÀN 1 = 100 HP
        MỖI MÀN +20 HP
    */

    const aiHp =
        100 + (level - 1) * 20;

    let aiWeapon = null;

    let aiBonus = 0;

    if(level === 10){

        aiWeapon = "dagger";
        aiBonus = 1;
    }

    if(level === 20){

        aiWeapon = "sword";
        aiBonus = 5;
    }

    if(level === 30){

        aiWeapon = "axe";
        aiBonus = 10;
    }

    p1 = {

        x:80,
        y:getGroundY()-70,

        w:30,
        h:70,

        vx:0,
        vy:0,

        hp:100,
        maxHp:100,

        color:"#3498db",

        facingRight:true,

        attacking:false,
        attackType:null,

        isDashing:false,

        weapon:equippedWeapon,

        bonusDmg:playerBonus
    };

    p2 = {

        x:canvas.width-120,
        y:getGroundY()-70,

        w:30,
        h:70,

        vx:0,
        vy:0,

        hp:aiHp,
        maxHp:aiHp,

        color:"#e74c3c",

        facingRight:false,

        attacking:false,
        attackType:null,

        isDashing:false,

        weapon:aiWeapon,

        bonusDmg:aiBonus,

        skillTimer:0
    };

    updateUI();

    if(gameTimer){

        clearInterval(gameTimer);
    }

    gameTimer =
        setInterval(update,1000/60);
}


/* =====================================================
   PLAYER - NHẢY
===================================================== */

function jumpP1(){

    if(!p1) return;

    if(p1Stunned) return;

    const ground =
        getGroundY() - p1.h;

    if(p1.y >= ground - 2){

        p1.vy = -13;
    }
}


/* =====================================================
   PLAYER - DASH
===================================================== */

function dashP1(){

    if(!p1) return;

    if(p1Stunned) return;

    if(p1.isDashing) return;

    p1.isDashing = true;

    playSound("skill");

    p1.vx =
        p1.facingRight
        ? 16
        : -16;

    setTimeout(()=>{

        if(p1){

            p1.isDashing =
                false;
        }

    },180);
}


/* =====================================================
   PLAYER - TẤN CÔNG
===================================================== */

function attackP1(type){

    if(!p1 || !p2) return;

    if(p1Stunned) return;

    if(p1.attacking) return;

    p1.attacking = true;

    p1.attackType = type;

    playSound(type);

    const range =
        type === "punch"
        ? 65
        : 80;

    const baseDamage =
        type === "punch"
        ? 8
        : 12;

    const damage =
        baseDamage +
        p1.bonusDmg;

    const dist =
        Math.abs(
            (p1.x + p1.w/2) -
            (p2.x + p2.w/2)
        );

    if(
        dist < range &&
        Math.abs(p1.y-p2.y) < 60
    ){

        p2.hp =
            Math.max(
                0,
                p2.hp - damage
            );

        p2.x +=
            p1.facingRight
            ? 12
            : -12;

        updateUI();
    }

    setTimeout(()=>{

        if(p1){

            p1.attacking =
                false;

            p1.attackType =
                null;
        }

    },250);
}


/* =====================================================
   AI
===================================================== */

function updateAI(){

    if(!p1 || !p2) return;

    if(p1.hp <= 0 || p2.hp <= 0){
        return;
    }

    p2.facingRight =
        p2.x < p1.x;

    const dist =
        Math.abs(
            (p2.x + p2.w/2) -
            (p1.x + p1.w/2)
        );

    /*
        AI MẠNH VÀ NHANH DẦN
        THEO TỪNG MÀN
    */

    const aiSpeed =
        1.8 +
        Math.min(
            currentLevel * 0.09,
            3
        );

    p2.skillTimer += 1/60;

    if(dist > 70){

        p2.vx =
            p2.facingRight
            ? aiSpeed
            : -aiSpeed;

    }else{

        const attackChance =
            0.012 +
            currentLevel * 0.0008;

        if(
            !p2.attacking &&
            Math.random() < attackChance
        ){

            aiAttack(
                Math.random() < 0.5
                ? "punch"
                : "kick"
            );
        }
    }


    /* BOSS MÀN 10 */

    if(
        currentLevel === 10 &&
        p2.skillTimer >= 10
    ){

        p2.skillTimer = 0;

        boss10Skill();
    }


    /* BOSS MÀN 20 */

    if(
        currentLevel === 20 &&
        p2.skillTimer >= 8
    ){

        p2.skillTimer = 0;

        boss20Skill();
    }


    /* BOSS MÀN 30 */

    if(
        currentLevel === 30 &&
        p2.skillTimer >= 9
    ){

        p2.skillTimer = 0;

        boss30Skill();
    }
}


/* =====================================================
   AI TẤN CÔNG THƯỜNG
===================================================== */

function aiAttack(type){

    if(!p1 || !p2) return;

    if(p2.attacking) return;

    p2.attacking = true;

    p2.attackType = type;

    playSound(type);

    const range =
        type === "punch"
        ? 60
        : 75;

    const baseDamage =
        type === "punch"
        ? 7
        : 11;

    const levelBonus =
        Math.floor(
            currentLevel / 5
        );

    const damage =
        baseDamage +
        levelBonus +
        p2.bonusDmg;

    const dist =
        Math.abs(
            (p2.x+p2.w/2) -
            (p1.x+p1.w/2)
        );

    if(
        dist < range &&
        Math.abs(p1.y-p2.y) < 60
    ){

        p1.hp =
            Math.max(
                0,
                p1.hp-damage
            );

        updateUI();
    }

    setTimeout(()=>{

        if(p2){

            p2.attacking =
                false;

            p2.attackType =
                null;
