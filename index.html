<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stickman Fighting - Lobby System</title>
    <style>
        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none; 
            margin: 0; 
            padding: 0; 
            touch-action: none; 
        }
        html, body { 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        #game-wrapper { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background: #111; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        canvas { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            background: #222; 
        }
        
        /* GIAO DIỆN SẢNH CHỜ (LOBBY UI) */
        #lobby-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .lobby-title {
            font-size: 42px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(231, 76, 60, 0.8), 0 0 30px rgba(52, 152, 219, 0.6);
        }
        .lobby-cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .play-card {
            width: 220px;
            height: 140px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .play-card:active {
            transform: scale(0.95);
            background: rgba(46, 204, 113, 0.3);
            border-color: #2ecc71;
        }
        .play-card .icon { font-size: 40px; margin-bottom: 10px; }
        .play-card .text { color: #fff; font-weight: bold; font-size: 18px; }

        /* NÚT ĐIỀU KHIỂN GAME */
        .controls-layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            pointer-events: none; 
            display: none; 
            justify-content: space-between; 
            align-items: flex-end; 
            padding: 15px 25px; 
            box-sizing: border-box; 
        }
        .btn-group { display: flex; gap: 12px; pointer-events: auto; }
        .btn { 
            position: relative; width: 65px; height: 65px; 
            background: rgba(255, 255, 255, 0.2); 
            border: 2px solid rgba(255, 255, 255, 0.6); 
            border-radius: 50%; color: white; font-size: 26px; font-weight: bold; 
            display: flex; align-items: center; justify-content: center; 
            backdrop-filter: blur(4px); 
        }
        .btn:active { background: rgba(255, 255, 255, 0.5); transform: scale(0.92); }
        .btn-attack { width: 75px; height: 75px; background: rgba(231, 76, 60, 0.6); border-color: #e74c3c; font-size: 30px; }
        .btn-jump { background: rgba(46, 204, 113, 0.6); border-color: #2ecc71; }
        .btn-dash { background: rgba(241, 196, 15, 0.6); border-color: #f1c40f; }
        .btn-skill { background: rgba(155, 89, 182, 0.6); border-color: #9b59b6; }
        
        .cooldown-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.75); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; 
            font-size: 18px; color: #f1c40f; font-weight: bold; opacity: 0; 
        }

        /* MÀN HÌNH GAME OVER */
        #game-over-screen { 
            display: none; 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.85); 
            flex-direction: column; align-items: center; justify-content: center; 
            z-index: 10; pointer-events: auto; 
        }
        #game-over-title { font-size: 40px; font-weight: bold; color: #fff; margin-bottom: 20px; text-shadow: 0 0 10px #e74c3c; }
        .btn-action-group { display: flex; gap: 15px; }
        .game-btn { 
            padding: 12px 30px; font-size: 18px; font-weight: bold; 
            color: white; border: none; border-radius: 30px; 
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        .btn-restart { background: #27ae60; }
        .btn-lobby { background: #e67e22; }
        .game-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div id="game-wrapper">
    <!-- SẢNH CHỜ (LOBBY) -->
    <div id="lobby-screen">
        <div class="lobby-title">Stickman Arena</div>
        <div class="lobby-cards">
            <div class="play-card" onclick="startGame()">
                <div class="icon">⚔️</div>
                <div class="text">ĐẤU VỚI AI</div>
            </div>
        </div>
    </div>

    <canvas id="game" width="800" height="400"></canvas>
    
    <!-- MÀN HÌNH KẾT THÚC -->
    <div id="game-over-screen">
        <div id="game-over-title">VICTORY!</div>
        <div class="btn-action-group">
            <button class="game-btn btn-restart" onclick="resetGame()">Chơi tiếp</button>
            <button class="game-btn btn-lobby" onclick="returnToLobby()">Về sảnh</button>
        </div>
    </div>

    <!-- PHÍM ĐIỀU KHIỂN CẢM ỨNG -->
    <div class="controls-layer" id="controls">
        <div class="btn-group">
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group" style="align-items: flex-end;">
            <div class="btn btn-jump" id="btn-jump">▲</div>
            <div class="btn btn-dash" id="btn-dash">
                ⚡
                <div class="cooldown-overlay" id="dash-cd"></div>
            </div>
            <div class="btn btn-skill" id="btn-skill">
                🔥
                <div class="cooldown-overlay" id="skill-cd"></div>
            </div>
            <div class="btn btn-attack" id="btn-attack">⚔️</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.6;
const GROUND = 340;
let isGameOver = false;
let inGame = false;

const projectiles = [];

const p1 = { 
    x: 120, y: 150, vx: 0, vy: 0, w: 40, h: 80, hp: 100, 
    color: '#e74c3c', attacking: false, facingRight: 1, animFrame: 0,
    skillCooldown: false, isDashing: false, dashCooldown: false, dashHit: false
};

const p2 = { 
    x: 640, y: 150, vx: 0, vy: 0, w: 40, h: 80, hp: 100, 
    color: '#3498db', attacking: false, attackCooldown: false, facingRight: -1, animFrame: 0,
    skillCooldown: false, isDashing: false, dashCooldown: false, dashHit: false,
    rapidPunchCooldown: false, isRapidPunching: false
};

const inputs = { left: false, right: false };

function bindBtn(id, onPressDown, onPressUp) {
    const el = document.getElementById(id);
    const start = (e) => { e.preventDefault(); onPressDown(); };
    const end = (e) => { e.preventDefault(); if (onPressUp) onPressUp(); };

    el.addEventListener('touchstart', start, { passive: false });
    el.addEventListener('touchend', end, { passive: false });
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
}

bindBtn('btn-left', () => inputs.left = true, () => inputs.left = false);
bindBtn('btn-right', () => inputs.right = true, () => inputs.right = false);

bindBtn('btn-jump', () => {
    if (p1.y + p1.h >= GROUND && !isGameOver && inGame) p1.vy = -14;
});

bindBtn('btn-attack', () => {
    if (!p1.attacking && !isGameOver && inGame) {
        p1.attacking = true;
        setTimeout(() => p1.attacking = false, 150);
    }
});

function castDash(char, targetOverlayId) {
    if (char.dashCooldown || char.isDashing || isGameOver || !inGame) return;

    char.isDashing = true;
    char.dashCooldown = true;
    char.dashHit = false;

    setTimeout(() => {
        char.isDashing = false;
    }, 200);

    if (targetOverlayId) {
        const cdOverlay = document.getElementById(targetOverlayId);
        let timeLeft = 2;
        cdOverlay.style.opacity = '1';
        cdOverlay.innerText = timeLeft;

        const cdInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                cdOverlay.innerText = timeLeft;
            } else {
                clearInterval(cdInterval);
                cdOverlay.style.opacity = '0';
                char.dashCooldown = false;
            }
        }, 1000);
    } else {
        setTimeout(() => { char.dashCooldown = false; }, 2000);
    }
}

bindBtn('btn-dash', () => castDash(p1, 'dash-cd'));

function castSkill(char, targetOverlayId) {
    if (char.skillCooldown || isGameOver || !inGame) return;

    char.skillCooldown = true;

    projectiles.push({
        x: char.facingRight === 1 ? char.x + char.w : char.x - 20,
        y: char.y + 25,
        vx: char.facingRight * 10,
        radius: 12,
        color: char === p1 ? '#f39c12' : '#00d2d3',
        owner: char
    });

    if (targetOverlayId) {
        const cdOverlay = document.getElementById(targetOverlayId);
        let timeLeft = 3;
        cdOverlay.style.opacity = '1';
        cdOverlay.innerText = timeLeft;

        const cdInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                cdOverlay.innerText = timeLeft;
            } else {
                clearInterval(cdInterval);
                cdOverlay.style.opacity = '0';
                char.skillCooldown = false;
            }
        }, 1000);
    } else {
        setTimeout(() => { char.skillCooldown = false; }, 3000);
    }
}

bindBtn('btn-skill', () => castSkill(p1, 'skill-cd'));

// SKILL ĐẤM LIÊN TỤC DÀNH CHO AI (MÁY)
function castAiRapidPunch() {
    if (p2.rapidPunchCooldown || p2.isRapidPunching || isGameOver || !inGame) return;

    p2.isRapidPunching = true;
    p2.rapidPunchCooldown = true;

    // Đấm liên tục mỗi 0.2s trong 3s (15 cú đấm)
    const punchInterval = setInterval(() => {
        if (isGameOver || !inGame || !p2.isRapidPunching) {
            clearInterval(punchInterval);
            return;
        }

        // Tạo hiệu ứng đấm ngắn
        p2.attacking = true;
        setTimeout(() => p2.attacking = false, 100);

        // Kiểm tra xem có trúng P1 không
        const hitBoxP2 = { 
            x: p2.facingRight === 1 ? p2.x + p2.w : p2.x - 45, 
            y: p2.y + 10, 
            w: 45, 
            h: 40 
        };

        if (isHit(hitBoxP2, p1)) {
            p1.hp = Math.max(0, p1.hp - 1); // 1 sát thương mỗi cú đấm
            p1.x += p2.facingRight * 6; // Đẩy lùi nhẹ
        }
    }, 200);

    // Dừng đấm sau 3 giây
    setTimeout(() => {
        clearInterval(punchInterval);
        p2.isRapidPunching = false;
    }, 3000);

    // Hồi chiêu 5 giây
    setTimeout(() => {
        p2.rapidPunchCooldown = false;
    }, 5000);
}

function drawLimb(startX, startY, midX, midY, endX, endY, jointColor) {
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(midX, midY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(midX, midY);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    ctx.fillStyle = jointColor;
    ctx.beginPath();
    ctx.arc(midX, midY, 3, 0, Math.PI * 2);
    ctx.fill();
}

function drawStickman(char) {
    const cx = char.x + char.w / 2;
    const cy = char.y;
    const dir = char.facingRight;
    const isJumping = char.y + char.h < GROUND;

    if (char.isDashing) {
        ctx.strokeStyle = 'rgba(241, 196, 15, 0.4)';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(cx - dir * 25, cy + 40);
        ctx.lineTo(cx - dir * 5, cy + 40);
        ctx.stroke();
    }

    // Hiệu ứng màu đỏ bộc phát khi AI xài đấm liên tục
    if (char.isRapidPunching) {
        ctx.strokeStyle = '#e67e22';
    } else {
        ctx.strokeStyle = char.isDashing ? '#f1c40f' : char.color;
    }
    
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.beginPath();
    ctx.arc(cx, cy + 12, 12, 0, Math.PI * 2);
    ctx.stroke();

    const hipX = cx;
    const hipY = cy + 55;
    ctx.beginPath();
    ctx.moveTo(cx, cy + 24);
    ctx.lineTo(hipX, hipY);
    ctx.stroke();

    const walk = (char.vx !== 0 && !isJumping) ? Math.sin(char.animFrame * 0.3) : 0;
    
    let knee1X = cx + (walk * 12) + (isJumping ? dir * 10 : 0);
    let knee1Y = cy + 68 + (isJumping ? -10 : 0);
    let foot1X = cx + (walk * 20) + (isJumping ? dir * 5 : 0);
    let foot1Y = GROUND;
    drawLimb(hipX, hipY, knee1X, knee1Y, foot1X, foot1Y, '#fff');

    let knee2X = cx - (walk * 12) - (isJumping ? dir * 5 : 0);
    let knee2Y = cy + 68 + (isJumping ? -5 : 0);
    let foot2X = cx - (walk * 20) - (isJumping ? dir * 15 : 0);
    let foot2Y = GROUND;
    drawLimb(hipX, hipY, knee2X, knee2Y, foot2X, foot2Y, '#fff');

    const shoulderX = cx;
    const shoulderY = cy + 32;

    let elbow2X = shoulderX - dir * 12;
    let elbow2Y = shoulderY + 12;
    let hand2X = shoulderX - dir * 18;
    let hand2Y = shoulderY + 25;

    // Khi đấm liên tục, vẽ cả 2 tay liên hồi
    if (char.isRapidPunching) {
        const alt = (char.animFrame % 2 === 0) ? 1 : -1;
        elbow2X = shoulderX + dir * 20;
        elbow2Y = shoulderY + alt * 8;
        hand2X = shoulderX + dir * 42;
        hand2Y = shoulderY + alt * 8;
    }
    drawLimb(shoulderX, shoulderY, elbow2X, elbow2Y, hand2X, hand2Y, '#fff');

    let elbow1X, elbow1Y, hand1X, hand1Y;
    if (char.attacking) {
        elbow1X = shoulderX + dir * 25;
        elbow1Y = shoulderY - 2;
        hand1X = shoulderX + dir * 48;
        hand1Y = shoulderY;

        ctx.fillStyle = char.isRapidPunching ? '#e74c3c' : '#f1c40f';
        ctx.beginPath();
        ctx.arc(hand1X, hand1Y, 8, 0, Math.PI * 2);
        ctx.fill();
    } else {
        elbow1X = shoulderX + dir * 12 + (walk * 8);
        elbow1Y = shoulderY + 12;
        hand1X = shoulderX + dir * 18 + (walk * 12);
        hand1Y = shoulderY + 24;
    }
    drawLimb(shoulderX, shoulderY, elbow1X, elbow1Y, hand1X, hand1Y, '#fff');

    char.animFrame++;
}

function isHit(r1, r2) {
    return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
           r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
}

function updateSmartAI() {
    const dx = p1.x - p2.x;
    const distance = Math.abs(dx);
    p2.facingRight = dx > 0 ? 1 : -1;

    let dangerProjectile = null;
    for (let p of projectiles) {
        if (p.owner === p1) {
            if ((p.vx > 0 && p.x < p2.x) || (p.vx < 0 && p.x > p2.x)) {
                if (Math.abs(p.x - p2.x) < 200) {
                    dangerProjectile = p;
                    break;
                }
            }
        }
    }

    if (dangerProjectile && p2.y + p2.h >= GROUND && Math.random() < 0.8) {
        p2.vy = -14;
    }

    // AI sử dụng chiêu đấm liên tục khi ở gần (khoảng cách < 80)
    if (distance < 80 && !p2.rapidPunchCooldown && Math.random() < 0.08) {
        castAiRapidPunch();
    }

    if (distance > 180 && distance < 450 && !p2.skillCooldown && Math.random() < 0.03) {
        castSkill(p2, null);
    }

    if (distance > 100 && distance < 250 && !p2.dashCooldown && Math.random() < 0.05) {
        castDash(p2, null);
    }

    if (distance > 45) {
        p2.vx = p2.facingRight * (p2.isRapidPunching ? 2.0 : 3.8); // Giảm tốc độ di chuyển khi đang đấm liên tục
    } else {
        p2.vx = 0;
        if (!p2.attacking && !p2.attackCooldown && !p2.isRapidPunching) {
            p2.attacking = true;
            p2.attackCooldown = true;
            setTimeout(() => p2.attacking = false, 150);
            setTimeout(() => p2.attackCooldown = false, 400);
        }
    }

    if (p1.y < p2.y - 30 && p2.y + p2.h >= GROUND && Math.random() < 0.08) {
        p2.vy = -14;
    }
}

function keepInBounds(char) {
    if (char.x < 10) char.x = 10;
    if (char.x + char.w > canvas.width - 10) char.x = canvas.width - char.w - 10;
}

function loop() {
    if (!inGame || isGameOver) return;

    p1.vx = 0;
    if (inputs.left) { p1.vx = -5; p1.facingRight = -1; }
    if (inputs.right) { p1.vx = 5; p1.facingRight = 1; }

    if (p1.isDashing) p1.vx = p1.facingRight * 16;
    if (p2.isDashing) p2.vx = p2.facingRight * 16;

    updateSmartAI();

    p1.x += p1.vx; p1.y += p1.vy; p1.vy += GRAVITY;
    if (p1.y + p1.h > GROUND) { p1.y = GROUND - p1.h; p1.vy = 0; }
    keepInBounds(p1);

    p2.x += p2.vx; p2.y += p2.vy; p2.vy += GRAVITY;
    if (p2.y + p2.h > GROUND) { p2.y = GROUND - p2.h; p2.vy = 0; }
    keepInBounds(p2);

    if (p1.isDashing && !p1.dashHit && isHit(p1, p2)) {
        p1.dashHit = true;
        p2.hp = Math.max(0, p2.hp - 5);
        p2.x += p1.facingRight * 20;
    }

    if (p2.isDashing && !p2.dashHit && isHit(p2, p1)) {
        p2.dashHit = true;
        p1.hp = Math.max(0, p1.hp - 5);
        p1.x += p2.facingRight * 20;
    }

    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        const projBox = { x: p.x - p.radius, y: p.y - p.radius, w: p.radius * 2, h: p.radius * 2 };

        if (p.owner === p1 && isHit(projBox, p2)) {
            p2.hp = Math.max(0, p2.hp - 20);
            p2.x += p.vx > 0 ? 35 : -35;
            projectiles.splice(i, 1);
            continue;
        }

        if (p.owner === p2 && isHit(projBox, p1)) {
            p1.hp = Math.max(0, p1.hp - 20);
            p1.x += p.vx > 0 ? 35 : -35;
            projectiles.splice(i, 1);
            continue;
        }

        if (p.x < 0 || p.x > canvas.width) projectiles.splice(i, 1);
    }

    const hitBoxP1 = { x: p1.facingRight === 1 ? p1.x + p1.w : p1.x - 40, y: p1.y + 10, w: 40, h: 30 };
    if (p1.attacking && isHit(hitBoxP1, p2)) {
        p1.attacking = false;
        p2.hp = Math.max(0, p2.hp - 1);
        p2.x += p1.facingRight * 25;
    }

    const hitBoxP2 = { x: p2.facingRight === 1 ? p2.x + p2.w : p2.x - 40, y: p2.y + 10, w: 40, h: 30 };
    if (p2.attacking && !p2.isRapidPunching && isHit(hitBoxP2, p1)) {
        p2.attacking = false;
        p1.hp = Math.max(0, p1.hp - 1);
        p1.x += p2.facingRight * 25;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#555';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    ctx.lineTo(canvas.width, GROUND);
    ctx.stroke();

    drawStickman(p1);
    drawStickman(p2);

    projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius / 2, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.fillStyle = '#333';
    ctx.fillRect(20, 20, 280, 16);
    ctx.fillRect(500, 20, 280, 16);

    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(20, 20, p1.hp * 2.8, 16);
    ctx.
